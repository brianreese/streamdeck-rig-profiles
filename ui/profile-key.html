<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
        color: #d8d8d8; background: #2d2d2d; margin: 0; padding: 12px;
      }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      label { flex: 0 0 92px; text-align: right; color: #969696; }
      select { flex: 1; background: #3d3d3d; color: #d8d8d8;
        border: 1px solid #4d4d4d; border-radius: 4px; padding: 4px 6px; }
      select.unset { border-color: #e8a317; }
      .hint { margin-left: 100px; color: #7a7a7a; font-size: 11px; }
      .warn { margin-left: 100px; color: #e8a317; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="row">
      <label for="profile">Profile</label>
      <select id="profile"><option value="">Loading…</option></select>
    </div>
    <div class="hint" id="summary">This key activates the selected profile.</div>
    <div class="warn" id="warn" hidden></div>

    <script>
      // Hand-rolled property inspector against the documented SDK v2 socket
      // contract. No component library: the plugin has no build step, and the
      // page must work offline with no CDN.
      let ws, uuid;
      let globals = null;
      let settings = {};

      function send(event, payload) {
        if (ws?.readyState !== 1) return;
        ws.send(JSON.stringify({ event, context: uuid, payload }));
      }

      function saveSettings(next) {
        settings = { ...settings, ...next };
        ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings }));
      }

      function render() {
        const select = document.getElementById('profile');
        const summary = document.getElementById('summary');
        const warn = document.getElementById('warn');
        const profiles = globals?.profiles ?? [];
        const chosen = settings?.profileId ?? '';

        if (!profiles.length) {
          select.innerHTML = '<option value="">No profiles configured yet</option>';
          summary.textContent = 'Edit config/profiles.yaml, then restart Stream Deck.';
          return;
        }

        // A placeholder is essential when nothing is saved. Without it the
        // browser shows the first profile as though it were selected, the user
        // never fires a change event, and the key stays silently unassigned —
        // looking configured while doing nothing on press.
        const placeholder = chosen
          ? ''
          : '<option value="" selected>— Select a profile —</option>';

        select.innerHTML =
          placeholder +
          profiles
            .map(
              (p) =>
                `<option value="${p.id}"${p.id === chosen ? ' selected' : ''}>${p.name}</option>`,
            )
            .join('');
        select.classList.toggle('unset', !chosen);

        if (!chosen) {
          summary.textContent = 'This key does nothing until you pick a profile.';
          warn.hidden = true;
          return;
        }

        const active = profiles.find((p) => p.id === chosen);
        const providers = Object.keys(active?.providers ?? {});
        summary.textContent = providers.length
          ? `Applies: ${providers.join(', ')}${active.restricted ? ' — hold to activate' : ''}`
          : 'This profile does not configure any hardware yet.';

        // Surfaced by the migration: a legacy FanaLab hotkey has no wheelbase
        // slot equivalent, so the user has to pick one.
        warn.hidden = !active?.needsWheelbaseSetup;
        warn.textContent = 'This profile still needs a wheelbase setup slot.';
      }

      document.getElementById('profile').addEventListener('change', (e) => {
        saveSettings({ profileId: e.target.value });
        render();
      });

      function connectElgatoStreamDeckSocket(port, propertyInspectorUUID, registerEvent, info, actionInfoJson) {
        uuid = propertyInspectorUUID;
        settings = JSON.parse(actionInfoJson)?.payload?.settings ?? {};
        ws = new WebSocket(`ws://127.0.0.1:${port}`);

        ws.onopen = () => {
          ws.send(JSON.stringify({ event: registerEvent, uuid }));
          send('getGlobalSettings');
          send('getSettings');
        };

        ws.onmessage = (evt) => {
          const msg = JSON.parse(evt.data);
          if (msg.event === 'didReceiveGlobalSettings') {
            globals = msg.payload.settings;
            render();
          }
          // Track the live per-key settings rather than the actionInfo snapshot,
          // which goes stale the moment anything is saved.
          if (msg.event === 'didReceiveSettings') {
            settings = msg.payload.settings ?? {};
            render();
          }
        };
      }
      window.connectElgatoStreamDeckSocket = connectElgatoStreamDeckSocket;
    </script>
  </body>
</html>
