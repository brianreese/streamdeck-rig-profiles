<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rig Profiles</title>
    <style>
      /* Three rails, fixed roles, and nothing that moves between them:
         LEFT is what you are editing, CENTRE is the thing itself, RIGHT is
         what you can do to it. Actions used to be scattered across the header,
         the bottom of a form and the middle of a card, and the complaint that
         "add hardware gets lost at the end" was really a complaint that there
         was nowhere for an action to live. Now there is. */
      :root {
        color-scheme: dark;

        --bg: #17181b;
        --panel: #1c1e22;
        --rail: #1a1c20;
        --card: #232529;
        --raise: #292c32;
        --line: #33363d;
        --hair: #2a2d33;

        --fg: #e6e8ec;
        --dim: #a2a8b3;
        --faint: #767c88;

        --accent: #4c8dff;
        --accent-deep: #2f6fe0;
        --green: #46b95a;
        --amber: #e3b341;
        --red: #f16a60;

        /* Scenes get their own accent, and it is not decoration. A profile and
           a scene are the same shape and behave completely differently — one
           says who is at the rig, the other flashes some lights — so the
           editor never lets you be unsure which one is under the cursor. The
           segmented control says it in words; the violet says it at a glance. */
        --scene: #a077ff;
        --scene-deep: #7a4fe0;

        --r: 10px;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font: 13.5px/1.55 -apple-system, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        color: var(--fg); background: var(--bg); margin: 0;
        display: flex; flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
      ::selection { background: #2f4a80; }

      /* ------------------------------------------------------------ header */
      header {
        display: flex; align-items: center; gap: 10px;
        padding: 0 16px; height: 46px; flex: 0 0 auto;
        background: var(--panel); border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 13px; margin: 0; font-weight: 650; letter-spacing: 0.4px;
        text-transform: uppercase; color: var(--fg);
      }
      header .spacer { flex: 1; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; }
      .dot.live { background: var(--green); box-shadow: 0 0 0 3px rgba(70, 185, 90, 0.15); }
      .dot.gone { background: var(--red); box-shadow: 0 0 0 3px rgba(241, 106, 96, 0.15); }
      .conn { color: var(--faint); font-size: 12px; }

      /* ------------------------------------------------------------- rails */
      main {
        flex: 1; min-height: 0;
        display: grid; grid-template-columns: 268px minmax(420px, 1fr) 264px;
      }
      aside {
        background: var(--rail); display: flex; flex-direction: column;
        min-height: 0; min-width: 0;
      }
      #railLeft { border-right: 1px solid var(--line); }
      #rail { border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 12px 20px; gap: 16px; }

      .rail-head {
        display: flex; align-items: center; gap: 8px;
        padding: 12px 12px 8px; flex: 0 0 auto;
      }
      .rail-title {
        font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
        text-transform: uppercase; color: var(--faint); flex: 1;
      }
      .rail-group + .rail-group { margin-top: 16px; }
      .rail-group > h4 {
        margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
        text-transform: uppercase; color: var(--faint);
      }

      /* --------------------------------------------------- kind selector */
      /* One list at a time, and a permanent label saying which. Two stacked
         lists were the alternative and were rejected: with both on screen the
         only thing distinguishing "delete this profile" from "delete this
         scene" is which heading you scrolled past, and these two do not
         deserve to be told apart by memory. */
      .seg {
        display: flex; gap: 2px; margin: 0 12px 8px; padding: 2px;
        background: #202227; border: 1px solid var(--hair); border-radius: 9px;
      }
      .seg button {
        flex: 1; background: none; border: 1px solid transparent; color: var(--dim);
        padding: 6px 8px; border-radius: 7px; font: inherit; font-size: 12.5px;
        font-weight: 600; cursor: pointer;
      }
      .seg button:hover { background: #292c32; color: var(--fg); }
      .seg button.on { background: var(--accent-deep); border-color: #3f7ae8; color: #fff; }
      .seg button.on[data-kind="scenes"] { background: var(--scene-deep); border-color: #8d63ea; }
      /* The one line that explains the difference, where the choice is made. */
      .segnote {
        padding: 0 13px 10px; color: var(--faint); font-size: 11.5px; line-height: 1.45;
      }

      /* ---------------------------------------------------- profile list */
      .pad { padding: 0 12px 10px; flex: 0 0 auto; }
      #list { list-style: none; margin: 0; padding: 0 8px 8px; overflow-y: auto; flex: 1; min-height: 0; }
      #list li {
        display: flex; align-items: center; gap: 9px; padding: 7px 8px;
        border-radius: 8px; cursor: pointer; margin-bottom: 2px;
        border: 1px solid transparent; position: relative;
      }
      #list li:hover { background: #24262b; }
      #list li.sel { background: #26334d; border-color: #38507e; }
      #list li.sel .who b { color: #fff; }
      #list li.drop-before { box-shadow: 0 -2px 0 var(--accent); }
      #list li.drop-after { box-shadow: 0 2px 0 var(--accent); }
      #list li.empty { cursor: default; color: var(--faint); font-size: 12px; padding: 12px 8px; }
      #list .grip { color: #4a4d55; cursor: grab; flex: 0 0 auto; font-size: 12px; }
      #list li:hover .grip { color: #6d717a; }
      #list .who { flex: 1; min-width: 0; }
      #list .who b { display: block; font-weight: 600; font-size: 13px;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #list .who span { display: block; color: var(--faint); font-size: 11px;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #list .bad { color: var(--red); font-weight: 700; flex: 0 0 auto; }

      /* The swatch doubles as the accessibility demo: its initial is drawn in
         whichever ink actually reads against the chosen colour. */
      .swatch {
        width: 28px; height: 28px; border-radius: 7px; flex: 0 0 auto;
        background-size: cover; background-position: center;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 700; line-height: 1;
      }
      .swatch.photo { color: transparent; }

      nav { border-top: 1px solid var(--hair); padding: 8px; flex: 0 0 auto; }
      .navbtn {
        display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
        background: none; border: 1px solid transparent; color: var(--dim);
        padding: 8px 9px; border-radius: 8px; font: inherit; cursor: pointer;
      }
      .navbtn:hover { background: #24262b; color: var(--fg); }
      .navbtn.sel { background: #26334d; border-color: #38507e; color: #fff; }
      .navbtn .ico { font-size: 14px; width: 16px; text-align: center; }

      /* ------------------------------------------------------------- pane */
      section#pane { overflow-y: auto; padding: 22px 28px 40px; min-width: 0; }
      .pane-inner { max-width: 780px; }
      #pane h2 {
        margin: 0 0 4px; font-size: 21px; font-weight: 650; letter-spacing: -0.2px;
        overflow-wrap: anywhere;
      }
      #pane .sub { margin: 0 0 18px; color: var(--faint); font-size: 12.5px; }

      .card {
        background: var(--card); border: 1px solid var(--line);
        border-radius: var(--r); padding: 14px 16px 4px; margin-bottom: 14px;
        box-shadow: var(--shadow);
      }
      .card > h3 {
        margin: 0 0 12px; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.8px; color: var(--faint); font-weight: 700;
      }
      .card.plain { padding-bottom: 14px; }

      /* Hardware/app blocks read as separate things you added, not as one long
         form: own surface, own header strip, own accent edge. */
      .hw {
        background: var(--card); border: 1px solid var(--line);
        border-radius: var(--r); margin-bottom: 12px; overflow: hidden;
        box-shadow: var(--shadow); position: relative;
      }
      .hw::before {
        content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
        background: var(--accent-deep);
      }
      .hw-head {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 12px 10px 15px; background: var(--raise);
        border-bottom: 1px solid var(--line);
      }
      .hw-head .pname { font-weight: 650; font-size: 13.5px; }
      .hw-body { padding: 13px 16px 4px 15px; }
      .hw-body:empty { display: none; }
      .hw.flash { animation: flash 1.1s ease-out; }
      .card.flash { animation: flash 1.1s ease-out; }
      @keyframes flash {
        0%, 40% { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(76, 141, 255, 0.18); }
        100% { border-color: var(--line); box-shadow: var(--shadow); }
      }

      .badge {
        font-size: 10.5px; color: var(--faint); border: 1px solid var(--line);
        border-radius: 20px; padding: 1px 8px; white-space: nowrap;
      }
      .cfglink {
        font-size: 11.5px; color: var(--accent); background: none; border: none;
        padding: 2px 6px; border-radius: 5px; cursor: pointer; font-family: inherit;
        white-space: nowrap;
      }
      .cfglink:hover { background: rgba(76, 141, 255, 0.12); }

      /* ------------------------------------------------------------ fields */
      .row {
        display: grid; grid-template-columns: 156px minmax(0, 1fr);
        align-items: center; gap: 10px; margin-bottom: 10px;
      }
      .row > label { color: var(--dim); font-size: 12.5px; }
      .row .grp { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .help {
        grid-column: 2; margin: -6px 0 10px; color: var(--faint);
        font-size: 11.5px; line-height: 1.45;
      }
      .help.wide { grid-column: 1 / -1; margin-left: 0; }
      .muted { color: var(--faint); font-size: 12px; }

      input[type="text"], input[type="password"], input[type="search"], select, textarea {
        background: #1b1d21; color: var(--fg); border: 1px solid #3a3d44;
        border-radius: 7px; padding: 7px 9px; font: inherit; width: 100%; min-width: 0;
      }
      input[type="text"]:hover, input[type="password"]:hover, select:hover { border-color: #4a4e57; }
      input::placeholder { color: #61666f; }
      select { cursor: pointer; }
      input[type="color"] {
        width: 40px; height: 34px; padding: 2px; background: #1b1d21;
        border: 1px solid #3a3d44; border-radius: 7px; flex: 0 0 auto; cursor: pointer;
      }
      input[type="checkbox"] {
        width: 16px; height: 16px; flex: 0 0 auto; accent-color: var(--accent-deep); cursor: pointer;
      }
      input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent-deep); }
      input[type="range"]:disabled { opacity: 0.3; }
      input[type="file"] { font-size: 12px; color: var(--dim); flex: 1; min-width: 0; }
      input[type="file"]::file-selector-button {
        background: #34373e; color: var(--fg); border: 1px solid #43464e;
        border-radius: 6px; padding: 5px 10px; margin-right: 10px; font: inherit; cursor: pointer;
      }
      textarea { font-family: ui-monospace, Consolas, monospace; font-size: 12px; resize: vertical; }
      textarea.cmds { height: 104px; }
      textarea.yaml { height: 360px; }
      .rv {
        flex: 0 0 82px; text-align: right; font-variant-numeric: tabular-nums;
        font-size: 12px; color: var(--dim);
      }
      .rv.off { color: #5d626b; }

      /* ----------------------------------------------------------- buttons */
      button {
        background: #2f3238; color: var(--fg); border: 1px solid #3f434b;
        border-radius: 7px; padding: 7px 12px; font: inherit; cursor: pointer;
      }
      button:hover { background: #383c43; border-color: #4a4e57; }
      button:active { transform: translateY(1px); }
      button.primary { background: var(--accent-deep); border-color: #3f7ae8; color: #fff; font-weight: 600; }
      button.primary:hover { background: #3a7bef; }
      button.danger { color: #f0a49d; border-color: #5c3a37; background: #2b2224; }
      button.danger:hover { background: #3a2a2b; border-color: #7a4b46; }
      button.wide { width: 100%; }
      button.icon {
        background: none; border: none; color: var(--faint); padding: 4px 7px;
        border-radius: 6px; line-height: 1;
      }
      button.icon:hover { background: #34373e; color: var(--fg); }
      button.icon.rm:hover { color: var(--red); }
      .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }

      /* "+ thing" rather than a dropdown: the choices are few, and a list of
         buttons says "these are the things you can add" without being opened. */
      .addbtn {
        display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
        background: #212328; border: 1px solid var(--hair); border-radius: 8px;
        padding: 8px 10px; margin-bottom: 6px; color: var(--fg); font: inherit; cursor: pointer;
      }
      .addbtn:hover { background: #282b31; border-color: #43474f; }
      .addbtn .plus { color: var(--accent); font-weight: 700; font-size: 14px; flex: 0 0 auto; }
      .addbtn .nm { flex: 1; min-width: 0; font-size: 12.5px; }
      .addbtn .nm i { display: block; font-style: normal; color: var(--faint); font-size: 11px; }

      /* ------------------------------------------------------- save status */
      .savecard {
        background: var(--card); border: 1px solid var(--line);
        border-radius: var(--r); padding: 11px 12px;
      }
      .savecard.bad { border-color: #6b3b37; background: #271f21; }
      .state { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
      .state .dot { width: 8px; height: 8px; }
      .state.saved .dot { background: var(--green); }
      .state.saving .dot { background: var(--accent); }
      .state.pending .dot { background: var(--amber); }
      .state.bad .dot { background: var(--red); }
      .state.bad { color: var(--red); }
      .savenote { color: var(--faint); font-size: 11px; margin-top: 5px; line-height: 1.4; }
      .savecard button { margin-top: 9px; }

      /* ------------------------------------------------------------ tiles */
      .tiles { display: flex; gap: 18px; align-items: flex-start; }
      .tiles figure { margin: 0; text-align: center; }
      .tiles img {
        width: 104px; height: 104px; border-radius: 12px; background: #101114;
        display: block; border: 1px solid var(--line);
      }
      .tiles figcaption { color: var(--faint); font-size: 11px; margin-top: 6px; }
      .tilenote { color: var(--faint); font-size: 11.5px; max-width: 300px; align-self: center; }
      .avatar-preview {
        width: 38px; height: 38px; border-radius: 8px; object-fit: cover;
        border: 1px solid #3a3d44; background: #1b1d21; flex: 0 0 auto;
      }

      /* ------------------------------------------------------------ scenes */
      /* While a scene is what is being edited, everything that is "this thing"
         carries the scene accent: the selected row, the card edges, the plus on
         the add buttons. Nothing moves, nothing is renamed — only the colour
         changes, which is enough to make a mis-click on the wrong list obvious
         before it is made. */
      body.scenemode #list li.sel { background: #302747; border-color: #55408a; }
      body.scenemode .hw::before { background: var(--scene-deep); }
      body.scenemode .addbtn .plus { color: var(--scene); }
      body.scenemode .cfglink { color: var(--scene); }
      body.scenemode .cfglink:hover { background: rgba(160, 119, 255, 0.14); }
      body.scenemode #pane h2::after {
        content: "Scene"; margin-left: 10px; vertical-align: 3px;
        font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
        color: var(--scene); border: 1px solid #55408a; border-radius: 20px;
        padding: 2px 8px; background: rgba(160, 119, 255, 0.1);
      }

      /* One row per scene a profile can also run. A label, so the whole row is
         the hit target rather than a 16px box. */
      .scenepick {
        display: flex; align-items: center; gap: 10px; padding: 7px 8px;
        border-radius: 8px; cursor: pointer; border: 1px solid transparent;
      }
      .scenepick:hover { background: #282b31; }
      .scenepick.on { background: #2a2440; border-color: #453567; }
      .scenepick .who { flex: 1; min-width: 0; }
      .scenepick .who b { display: block; font-weight: 600; font-size: 13px; }
      .scenepick .who span { display: block; color: var(--faint); font-size: 11px; }
      .scenepick.dim { opacity: 0.5; cursor: default; }
      .scenepick.dim:hover { background: none; }
      /* A scene that would set hardware the profile already sets itself. The
         runtime keeps the profile's, which is right and invisible — so say so. */
      .clash { color: var(--amber); font-size: 11px; display: block; }

      /* Profiles that reference the scene on screen, so deleting it is never a
         guess about what else it would take with it. */
      .users { display: flex; flex-wrap: wrap; gap: 6px; }
      .userchip {
        display: flex; align-items: center; gap: 7px; background: #212328;
        border: 1px solid var(--hair); border-radius: 20px; padding: 3px 11px 3px 4px;
        font-size: 12px; color: var(--fg); cursor: pointer; font-family: inherit;
      }
      .userchip:hover { background: #2b2e35; border-color: #464a53; }
      .userchip .swatch { width: 20px; height: 20px; border-radius: 6px; font-size: 10px; }

      /* ----------------------------------------------------------- issues */
      #issues:empty { display: none; }
      .issues {
        background: #2a1f21; border: 1px solid #6b3b37; border-left-width: 3px;
        border-radius: 8px; padding: 10px 13px; margin-bottom: 16px;
      }
      .issues b { color: var(--red); font-size: 12.5px; display: block; margin-bottom: 4px; }
      .issues ul { margin: 0; padding-left: 18px; color: #e2b7b3; font-size: 12.5px; }

      /* ----------------------------------------------------------- footer */
      footer {
        flex: 0 0 auto; padding: 7px 16px; border-top: 1px solid var(--line);
        background: var(--panel); min-height: 34px; max-height: 26vh; overflow-y: auto;
        font-size: 12px;
      }
      /* Save errors arrive one per problem, and hiding all but the first would
         mean fixing them one reload at a time. */
      #msg { white-space: pre-line; }
      .err { color: var(--red); }
      .ok { color: var(--green); }

      @media (max-width: 1140px) {
        main { grid-template-columns: 240px minmax(0, 1fr); }
        #railLeft { grid-row: 1 / span 2; }
        #pane { grid-column: 2; grid-row: 1; }
        #rail {
          grid-column: 2; grid-row: 2; border-left: none; border-top: 1px solid var(--line);
          flex-direction: row; flex-wrap: wrap; align-items: flex-start; overflow: visible;
        }
        #rail > .rail-group { flex: 1 1 220px; margin-top: 0; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Rig Profiles</h1>
      <span class="spacer"></span>
      <span class="dot" id="dot"></span>
      <span class="conn" id="conn">connecting…</span>
    </header>

    <main>
      <aside id="railLeft">
        <div class="rail-head">
          <span class="rail-title" id="railTitle">Profiles</span>
          <button id="add" title="Create a new profile">+ New</button>
        </div>
        <div class="seg" id="seg">
          <button data-kind="profiles" class="on">Profiles</button>
          <button data-kind="scenes">Scenes</button>
        </div>
        <div class="segnote" id="segnote"></div>
        <div class="pad">
          <input type="search" id="search" placeholder="Search profiles" autocomplete="off" />
        </div>
        <ol id="list"></ol>
        <nav>
          <button id="navSettings" class="navbtn"><span class="ico">⚙</span> Settings</button>
        </nav>
      </aside>

      <section id="pane"></section>
      <aside id="rail"></aside>
    </main>

    <footer><span id="msg" class="muted"></span></footer>

    <!-- A module, so the list operations can be imported from editorState.js
         and tested in Node without a browser. -->
    <script type="module">
      // The browser-hosted profile editor. Plain DOM and one fetch wrapper: the
      // plugin has no build step, and the page is served from the plugin itself
      // with a CSP that blocks anything external, so a framework could not be
      // loaded from a CDN even if one were wanted.
      //
      // Every request here is a request the property inspector also makes —
      // handlePiRequest on the other end is the same module. This page never
      // writes global settings itself; it asks for the same saveProfiles path,
      // so validation cannot be skipped by editing the page.

      // The token stays in the address bar so a reload still authenticates.
      const token = new URLSearchParams(location.search).get('t') ?? '';
      const q = `?t=${encodeURIComponent(token)}`;

      // Dynamic rather than plain imports so the token travels with them: every
      // route on this server takes the same key, with no exception to remember.
      const {
        addProfile, addScene, removeProfile, moveProfile, keepSelection,
        matchesSearch, slugify, withIds, fieldValue, optionLabel, holdForNaming,
        referencesScene, setSceneRef, profilesUsingScene, detachScene, sceneOverlap,
      } = await import(`./editorState.js${q}`);
      // Same module the key renderer uses, so "readable" means one thing here
      // and on the deck.
      const { readableTextColor } = await import(`./contrast.js${q}`);

      // Two lists, one editor.
      //
      // Profiles and scenes are the same shape and mean opposite things: a
      // profile is a claim about who is at the rig — exclusive, persistent,
      // gated when it is dangerous — and a scene is a moment of ambience that
      // must never be able to say a different human sat down. They are edited
      // side by side because they are configured the same way, and they are
      // never on screen at the same time because they must never be confused
      // for one another.
      let profiles = [];      // the draft being edited
      let scenes = [];        // the scene draft, saved in the same request
      let providers = [];     // [{id,label,verifiable,fields}] from the plugin
      let hardware = {};      // global settings draft (never holds the Govee key)
      // What is being edited, held by reference rather than by id — see
      // editorState.js for why an id is the wrong handle here. One selection per
      // list, so flipping to Scenes and back lands on the profile you left.
      let selectedProfile = null;
      let selectedScene = null;
      let kind = 'profiles';  // which list the sidebar shows: 'profiles' | 'scenes'
      let view = 'editor';    // 'editor' | 'settings'
      let previewTimer = null;

      /** The list the sidebar is showing. */
      const listOf = () => (kind === 'scenes' ? scenes : profiles);
      /** Is a scene the thing being edited right now? */
      const editingScene = () => kind === 'scenes' && view === 'editor';

      /** What the two lists are, in one line each, shown under the selector. */
      const KIND_NOTE = {
        profiles:
          'Who is at the rig. One at a time — pressing one turns the others off — ' +
          'and it is remembered until something else is pressed.',
        scenes:
          'A moment: lights, a playlist, a script. Fires and forgets. A scene never ' +
          'changes who the rig thinks is at it.',
      };

      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      /**
       * Global settings each provider depends on, so a provider card can point
       * at them. Discovering that the Govee key lived behind an unrelated menu
       * item took a search; a link from the thing that needs it does not.
       */
      const PROVIDER_SETTINGS = {
        'fanatec-base': 'Fanatec wheelbase',
        govee: 'Govee lighting',
        moza: 'MOZA pedal',
      };

      /**
       * Ask the plugin something. Same request names as the inspector's `ask`,
       * and the same promise: it always settles, because a request that never
       * answers is indistinguishable from a save that quietly did nothing.
       */
      async function ask(request, extra = {}) {
        try {
          const res = await fetch('/api', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-rig-editor': token },
            body: JSON.stringify({ request, ...extra }),
          });
          if (!res.ok) return { request, ok: false, error: `${res.status} ${res.statusText}` };
          return await res.json();
        } catch (err) {
          return { request, ok: false, error: err.message };
        }
      }

      function say(text, kind = 'muted') {
        const el = $('msg');
        el.className = kind;
        el.textContent = text;
      }

      /** The record on screen — a profile or a scene, depending on the tab. */
      const current = () => {
        const sel = kind === 'scenes' ? selectedScene : selectedProfile;
        return listOf().includes(sel) ? sel : null;
      };

      /** Set the selection for whichever list is showing. */
      function select(record) {
        if (kind === 'scenes') selectedScene = record;
        else selectedProfile = record;
      }

      // =====================================================================
      // Saving
      // =====================================================================
      //
      // One save, and it is automatic. There used to be two buttons — profiles
      // and settings — which asked the user to know which half of the screen a
      // change belonged to. That is the plugin's bookkeeping, not theirs.
      //
      // Autosave is safe here because the rules that make it dangerous
      // elsewhere do not apply. There is no partial write: saveProfiles
      // validates the whole list server-side and refuses it entire, so a
      // rejected save leaves the stored profiles exactly as they were and the
      // draft still dirty in the page. Nothing here is a transaction with the
      // outside world either — a saved profile does not touch the wheelbase,
      // it just sits in settings until a key is pressed.
      //
      // Two things it does have to respect:
      //
      //   * ids are slugged from the name the first time a profile is saved,
      //     and are permanent afterwards. Saving mid-word would freeze "Ka" as
      //     the id of "Kai" forever, so the first save of an unsaved profile
      //     waits for the name field to be left.
      //   * a half-typed API key must never overwrite a good one, so that one
      //     field commits on blur rather than on every keystroke.

      const AUTOSAVE_MS = 700;
      // Profiles and scenes are one draft with one dirty flag, because they are
      // saved in one request: a profile references scenes by id, so storing the
      // two halves separately would open a window where a saved profile names a
      // scene that is not stored yet.
      let dirtyDraft = false;
      let dirtySettings = false;
      let saveTimer = null;
      let saving = false;
      let saveAgain = false;
      let saveErrors = [];
      // record object -> its problems. Keyed by object rather than by id
      // because an unsaved record has no id, and those are exactly the ones
      // most likely to be rejected.
      let broken = new Map();
      let savedOnce = false;

      /** Mark a draft changed and schedule the save. */
      function touch(what, { now = false, defer = false } = {}) {
        if (what === 'settings') dirtySettings = true;
        else dirtyDraft = true;
        saveErrors = [];
        broken = new Map();
        renderSaveState();
        renderIssues();
        clearTimeout(saveTimer);
        if (defer) return;                       // dirty, but not on a timer yet
        saveTimer = setTimeout(commit, now ? 0 : AUTOSAVE_MS);
      }

      const isDirty = () => dirtyDraft || dirtySettings;

      /**
       * Is the caret currently in a not-yet-saved record's name field?
       *
       * Both lists, because both slug a permanent id out of the name on their
       * first save — a scene called "Kai's lights" would freeze as `ka` just as
       * readily as a profile would.
       */
      function namingInProgress() {
        return holdForNaming([...profiles, ...scenes], document.activeElement?.dataset?.f);
      }

      async function commit() {
        clearTimeout(saveTimer);
        saveTimer = null;

        // Overlapping saves would race over which reply is authoritative.
        if (saving) { saveAgain = true; return; }
        if (!isDirty()) return;

        // Hold, do not drop: the change stays dirty and saves the moment the
        // name is finished.
        if (namingInProgress()) {
          saveTimer = setTimeout(commit, AUTOSAVE_MS);
          renderSaveState();
          return;
        }

        saving = true;
        renderSaveState();
        const problems = [];

        if (dirtySettings) {
          const reply = await ask('saveSettings', {
            settings: {
              goveeApiKey: hardware.goveeApiKey ?? '',
              goveeDevices: hardware.goveeDevices?.length ? hardware.goveeDevices : null,
              // Always a literal boolean. The providers read these as
              // `settings?.x !== false`, so "missing" means enabled — writing
              // undefined for an unticked box would turn it straight back on
              // at the next switch, and the user would never see why.
              fanatecAutoStart: hardware.fanatecAutoStart !== false,
              mozaClosePitHouse: hardware.mozaClosePitHouse !== false,
              // The odd one out, and deliberately: reopening Pit House
              // re-applies its own preset over the one just written, so this
              // stays off until it is asked for.
              mozaReopenPitHouse: hardware.mozaReopenPitHouse === true,
            },
          });
          if (reply.ok === false) {
            problems.push(reply.error ?? 'settings could not be saved');
          } else {
            dirtySettings = false;
            hardware.goveeApiKeySet = reply.goveeApiKeySet;
            // Never keep the typed key around after it has been stored.
            delete hardware.goveeApiKey;
            // Cleared and relabelled in place rather than by re-rendering the
            // pane, which would throw away anything else being typed. The
            // placeholder follows the reply, not the fact that a save happened:
            // saving the MOZA checkbox must not claim a key is stored.
            const field = $('goveeKey');
            if (field) {
              field.value = '';
              field.placeholder = reply.goveeApiKeySet ? '•••••••• (saved)' : 'not set';
            }
          }
        }

        const nextBroken = new Map();

        if (dirtyDraft) {
          // Scenes first: a profile may reference one by id, and an id only
          // exists once its record has been slugged.
          withIds(scenes, 'scene');
          withIds(profiles);
          // avatarDataUri is a render-time convenience; never persist the bytes.
          // Global settings are deliberately not sent here: saveProfiles merges
          // what it is given over the stored blob, and this page is never told
          // the Govee key, so sending "the settings" back would erase it.
          const payload = profiles.map(({ avatarDataUri, ...rest }) => rest);
          const reply = await ask('saveProfiles', { profiles: payload, scenes });
          if (!reply.ok) {
            // Every problem, not just the first: they are named per record, and
            // showing one at a time means a fix per round-trip. Scene problems
            // are labelled, because "Sunset: needs a name" is otherwise a
            // profile as far as the reader is concerned.
            const mine = reply.errors ?? [];
            const theirs = reply.sceneErrors ?? [];
            if (!mine.length && !theirs.length) problems.push(reply.error ?? 'save failed');
            problems.push(...mine, ...theirs.map((m) => `Scene ${m}`));
            attribute(mine, profiles, nextBroken);
            attribute(theirs, scenes, nextBroken);
          } else {
            dirtyDraft = false;
            savedOnce = true;
          }
        }

        saving = false;
        saveErrors = problems;
        broken = nextBroken;

        if (problems.length) say(problems.join('\n'), 'err');
        else if ($('msg').className === 'err') say('');

        renderSaveState();
        renderIssues();
        renderList();
        renderRail();     // the id appears once a profile has been saved

        if (saveAgain) { saveAgain = false; commit(); }
      }

      /** The status shown in the right rail, in the one place it lives. */
      function saveStatus() {
        if (saveErrors.length) {
          return {
            cls: 'bad',
            text: `Not saved — ${saveErrors.length} problem${saveErrors.length === 1 ? '' : 's'}`,
            note: 'Your edits are still here. Fix the problems below and they save themselves.',
            retry: true,
          };
        }
        if (saving) return { cls: 'saving', text: 'Saving…', note: '' };
        if (isDirty()) {
          return {
            cls: 'pending',
            text: 'Unsaved changes',
            note: namingInProgress()
              ? `Saving as soon as you finish naming this ${editingScene() ? 'scene' : 'profile'}.`
              : 'Saving automatically…',
          };
        }
        return {
          cls: 'saved',
          text: 'All changes saved',
          note: savedOnce ? '' : 'Changes save themselves as you make them.',
        };
      }

      function renderSaveState() {
        const host = $('saveState');
        if (!host) return;
        const s = saveStatus();
        host.className = `savecard${s.cls === 'bad' ? ' bad' : ''}`;
        host.innerHTML =
          `<div class="state ${s.cls}"><span class="dot"></span><span>${esc(s.text)}</span></div>` +
          (s.note ? `<div class="savenote">${esc(s.note)}</div>` : '') +
          (s.retry ? '<button id="saveNow" class="wide">Try saving again</button>' : '');
      }

      /**
       * Split save errors back out to the records they name.
       *
       * The server prefixes each message with the record's name or id, so this
       * is the inverse. Done against one list at a time: a profile and a scene
       * are allowed to share a name, and attributing "Sunset: needs a name" to
       * whichever list happened to be searched first would put the error on the
       * wrong screen.
       */
      function attribute(messages, records, into) {
        for (const message of messages) {
          const at = message.indexOf(': ');
          const where = at > 0 ? message.slice(0, at) : '';
          const owner = records.find((r) => (r.name || r.id) === where || r.id === where);
          if (!owner) continue;
          into.set(owner, [...(into.get(owner) ?? []), message.slice(at + 2)]);
        }
      }

      /** Problems with the record on screen, shown above it rather than only
       *  in the footer — an error about a field you cannot see is a puzzle. */
      function renderIssues() {
        const host = $('issues');
        if (!host) return;
        const mine = broken.get(current()) ?? [];
        host.innerHTML = mine.length
          ? `<div class="issues"><b>This ${editingScene() ? 'scene' : 'profile'} cannot be saved yet</b><ul>${
              mine.map((m) => `<li>${esc(m)}</li>`).join('')}</ul></div>`
          : '';
      }

      // =====================================================================
      // Sidebar
      // =====================================================================

      function renderList() {
        const host = $('list');
        const all = listOf();
        const matches = all.filter((p) => matchesSearch(p, $('search').value));
        const scenery = kind === 'scenes';

        host.innerHTML = matches.map((p) => {
          const names = Object.keys(p.providers ?? {})
            .map((id) => providers.find((prov) => prov.id === id)?.label ?? id);
          // A profile's subtitle lists its hardware; a scene's says how many
          // profiles lean on it, because that is the number that decides
          // whether deleting it is safe.
          const used = scenery ? profilesUsingScene(profiles, p.id).length : 0;
          if (scenery && used) names.push(`used by ${used} profile${used === 1 ? '' : 's'}`);
          else if (!scenery && p.scenes?.length) names.push(`+${p.scenes.length} scene${p.scenes.length === 1 ? '' : 's'}`);
          // The initial is drawn in whichever ink actually reads on the chosen
          // colour — see contrast.js. A pale profile colour used to get white
          // text on white.
          const face = p.avatarDataUri
            ? `background-image:url(${p.avatarDataUri})`
            : `background:${esc(p.color)};color:${readableTextColor(p.color)}`;
          // Rows carry their index in the full list, not their id: search
          // filters the rows, and an unsaved profile has no id to carry.
          //
          // A row is only "selected" while this list is what the pane is
          // showing. On the settings screen nothing in this list is being
          // edited, so nothing in it is highlighted.
          const isSel = p === current() && view === 'editor';
          return `<li draggable="true" data-i="${all.indexOf(p)}" class="${isSel ? 'sel' : ''}">
            <span class="grip">⠿</span>
            <span class="swatch${p.avatarDataUri ? ' photo' : ''}" style="${face}"
              >${esc((p.name || '?').trim().charAt(0).toUpperCase())}</span>
            <span class="who">
              <b>${esc(p.name || '(unnamed)')}</b>
              <span>${esc(names.length ? names.join(', ') : 'nothing configured')}</span>
            </span>
            ${broken.has(p) ? '<span class="bad" title="Cannot be saved yet">!</span>' : ''}
          </li>`;
        }).join('');

        if (!matches.length) {
          host.innerHTML = `<li class="empty">${
            all.length
              ? 'Nothing matches that search.'
              : scenery
                ? 'No scenes yet — start with “+ New”. A scene is a lighting preset, a playlist, a script.'
                : 'No profiles yet — start with “+ New”.'}</li>`;
        }
      }

      /** Point the sidebar at one list or the other. */
      function setKind(next) {
        kind = next;
        view = 'editor';
        $('railTitle').textContent = next === 'scenes' ? 'Scenes' : 'Profiles';
        $('segnote').textContent = KIND_NOTE[next];
        $('search').placeholder = next === 'scenes' ? 'Search scenes' : 'Search profiles';
        $('add').title = next === 'scenes' ? 'Create a new scene' : 'Create a new profile';
        for (const b of $('seg').children) b.classList.toggle('on', b.dataset.kind === next);
        render();
      }

      // =====================================================================
      // Fields
      // =====================================================================

      /** Render one schema-declared field. Identical vocabulary to the inspector. */
      function fieldHtml(prov, field, cfg) {
        const v = cfg?.[field.key];
        const id = `${prov.id}|${field.key}`;
        const help = field.help ? `<div class="help">${esc(field.help)}</div>` : '';

        if (field.type === 'select') {
          const opts = (field.options ?? []).map((o) =>
            // optionLabel presents a wheelbase slot the way the Fanatec app
            // names it; everything else passes through untouched.
            `<option value="${esc(o.value)}"${String(v) === String(o.value) ? ' selected' : ''}
              >${esc(optionLabel(o.label))}</option>`).join('');
          return `<div class="row"><label>${esc(field.label)}</label>
            <select data-fld="${id}"><option value="">— none —</option>${opts}</select>${help}</div>`;
        }
        if (field.type === 'range') {
          // A slider always has a position, so it cannot express "leave this
          // setting alone". The checkbox carries that: unticked removes the key
          // from the profile entirely, which is what stops a blank field being
          // written to the pedal as a zero.
          const on = v !== undefined && v !== null && String(v) !== '';
          const shown = on ? v : field.min;
          return `<div class="row"><label>${esc(field.label)}</label>
            <div class="grp">
              <input type="checkbox" data-fldon="${id}"${on ? ' checked' : ''}
                     title="Set this on this profile" />
              <input type="range" data-fld="${id}" min="${field.min}" max="${field.max}"
                     step="${field.step ?? 1}" value="${esc(shown)}"${on ? '' : ' disabled'} />
              <span class="rv${on ? '' : ' off'}" data-rv="${id}" data-unit="${esc(field.unit ?? '')}"
                >${on ? esc(v) + (field.unit ?? '') : 'not set'}</span>
            </div>${help}</div>`;
        }
        if (field.type === 'boolean') {
          return `<div class="row"><label>${esc(field.label)}</label>
            <div class="grp"><input type="checkbox" data-fld="${id}"${v ? ' checked' : ''} />
            <span class="muted">${esc(field.help ?? '')}</span></div></div>`;
        }
        if (field.type === 'textarea') {
          return `<div class="row" style="align-items:flex-start"><label>${esc(field.label)}</label>
            <textarea class="cmds" data-fld="${id}" spellcheck="false"
              placeholder="${esc(field.placeholder ?? '')}">${esc(v ?? '')}</textarea>${help}</div>`;
        }
        return `<div class="row"><label>${esc(field.label)}</label>
          <input type="text" data-fld="${id}" value="${esc(v ?? '')}" />${help}</div>`;
      }

      /**
       * One card per thing this profile changes, built entirely from declared
       * schemas. The editor knows nothing about wheelbases, lights or scripts:
       * a profile shows only what it has actually been given.
       */
      function providerCardsHtml(p) {
        if (!providers.length) return '<div class="muted">Loading options…</div>';
        const enabled = providers.filter((prov) => p.providers?.[prov.id]);

        if (!enabled.length) {
          return `<div class="card plain"><div class="muted">
            Nothing here yet — this ${editingScene() ? 'scene' : 'profile'} will not change
            anything when its key is pressed. Add hardware, lights, apps or scripts from
            the right.
          </div></div>`;
        }

        return enabled.map((prov) => {
          const cfg = p.providers[prov.id] ?? {};
          const badge = prov.verifiable
            ? '' : '<span class="badge" title="This one cannot be read back">cannot confirm</span>';
          const settingsLink = PROVIDER_SETTINGS[prov.id]
            ? `<button class="cfglink" data-goto="${esc(prov.id)}"
                 title="This provider has options in Settings">⚙ ${esc(PROVIDER_SETTINGS[prov.id])} settings</button>`
            : '';
          return `<div class="hw" data-hw="${esc(prov.id)}">
            <div class="hw-head">
              <span class="pname">${esc(prov.label)}</span>${badge}
              <span style="flex:1"></span>${settingsLink}
              <button class="icon rm" data-rmprov="${esc(prov.id)}"
                      title="Remove ${esc(prov.label)} from this profile">✕</button>
            </div>
            <div class="hw-body">${(prov.fields ?? []).map((f) => fieldHtml(prov, f, cfg)).join('')}</div>
          </div>`;
        }).join('');
      }

      // =====================================================================
      // Panes
      // =====================================================================

      function render() {
        // The scene accent applies to the thing being edited, so it comes off
        // on the settings screen — otherwise Settings would wear a "Scene" pill.
        document.body.classList.toggle('scenemode', editingScene());
        renderList();
        $('navSettings').classList.toggle('sel', view === 'settings');
        if (view === 'settings') renderSettings();
        else if (kind === 'scenes') renderScene();
        else renderProfile();
        renderRail();
        renderIssues();
      }

      /**
       * The scenes a profile also runs.
       *
       * Placed after the provider cards, and worded as an addition, because
       * that is what it is: the profile's own hardware applies, then each
       * referenced scene fills in what the profile did not set. Where the two
       * overlap the profile wins — see `withScenes` in profileSwitch.js — which
       * is the right rule and completely invisible from the outside, so the
       * clash is called out on the row that causes it.
       */
      function sceneRefsHtml(p) {
        const rows = scenes.map((s) => {
          const on = referencesScene(p, s.id);
          // A scene with no id has never been saved, so there is nothing for a
          // profile to reference yet. It saves itself within the second.
          if (!s.id) {
            return `<div class="scenepick dim">
              <input type="checkbox" disabled />
              <span class="who"><b>${esc(s.name || '(unnamed)')}</b>
                <span>saving… it can be picked once it has an id</span></span></div>`;
          }
          const clash = on ? sceneOverlap(p, s) : [];
          const what = Object.keys(s.providers ?? {})
            .map((id) => providers.find((prov) => prov.id === id)?.label ?? id);
          return `<label class="scenepick${on ? ' on' : ''}">
            <input type="checkbox" data-sceneref="${esc(s.id)}"${on ? ' checked' : ''} />
            <span class="swatch" style="background:${esc(s.color)};color:${readableTextColor(s.color)}"
              >${esc((s.name || '?').trim().charAt(0).toUpperCase())}</span>
            <span class="who"><b>${esc(s.name || '(unnamed)')}</b>
              <span>${esc(what.length ? what.join(', ') : 'nothing configured')}</span>
              ${clash.length
                ? `<span class="clash">Also sets ${esc(clash
                    .map((id) => providers.find((prov) => prov.id === id)?.label ?? id)
                    .join(', '))}, which this profile sets itself — the profile's setting wins.</span>`
                : ''}
            </span></label>`;
        }).join('');

        return `<div class="card" data-hw="scene-refs">
          <h3>Also run these scenes</h3>
          <p class="muted" style="margin:-4px 0 10px">
            In addition to everything above, not instead of it. Scenes are momentary —
            adding one here does not change who the rig thinks is at it.
          </p>
          ${scenes.length ? rows : `<div class="muted">No scenes yet. Make one under
            <b>Scenes</b> in the sidebar and it will be offered here.</div>`}
        </div>`;
      }

      /** Who leans on the scene on screen, so deleting it is never a surprise. */
      function sceneUsersHtml(s) {
        const users = s.id ? profilesUsingScene(profiles, s.id) : [];
        return `<div class="card plain">
          <h3>Used by</h3>
          ${users.length
            ? `<div class="users">${users.map((p) => `<button class="userchip" data-useby="${
                esc(p.id)}"><span class="swatch" style="background:${esc(p.color)};color:${
                readableTextColor(p.color)}">${esc((p.name || '?').trim().charAt(0).toUpperCase())
                }</span>${esc(p.name || '(unnamed)')}</button>`).join('')}</div>
               <div class="savenote">These profiles run this scene as well as their own hardware.
                 Deleting it removes it from them.</div>`
            : `<div class="muted">No profile runs this scene. It still works on its own
                 key — that is what a scene is for.</div>`}
        </div>`;
      }

      function renderScene() {
        const s = current();
        if (!s) {
          $('pane').innerHTML = `<div class="pane-inner">
            <h2>No scene selected</h2>
            <p class="sub">Pick one on the left, or make a new one with “+ New”.
              A scene is a lighting preset, a playlist, a script — anything you want to
              fire without changing who is at the rig.</p></div>`;
          return;
        }

        $('pane').innerHTML = `<div class="pane-inner">
          <h2>${esc(s.name || '(unnamed)')}</h2>
          <p class="sub">${esc(s.id ? `id ${s.id}` : 'new scene')} · momentary —
            never changes the active profile</p>

          <div id="issues"></div>

          <div class="card plain">
            <h3>On the deck</h3>
            <div class="muted">No key preview yet. The plugin's renderer draws the three
              states a <em>profile</em> key has — inactive, switching, active and confirmed —
              and a scene has none of them: it fires and it is over. Showing one of those
              tiles here would be claiming something about the key that is not true.</div>
          </div>

          <div class="card">
            <h3>Identity</h3>
            <div class="row">
              <label for="pname">Name</label>
              <div class="grp">
                <input type="text" id="pname" data-f="name" value="${esc(s.name)}"
                       autocomplete="off" spellcheck="false" />
                <input type="color" data-f="color" value="${esc(s.color)}" title="Key colour" />
              </div>
            </div>
            <div class="help wide">No avatar and no hold-to-switch. An avatar is a face and a
              scene is not a person; the hold gate exists so a child cannot grab full force
              feedback by accident, and a scene has no force feedback to grab.</div>
          </div>

          ${providerCardsHtml(s)}

          ${sceneUsersHtml(s)}
        </div>`;
      }

      function renderProfile() {
        const p = current();
        if (!p) {
          $('pane').innerHTML = `<div class="pane-inner">
            <h2>No profile selected</h2>
            <p class="sub">Pick one on the left, or make a new one with “+ New”.</p></div>`;
          return;
        }

        // Order matters here: what the key will look like comes first, because
        // that is the thing being made. The fields that produce it follow.
        $('pane').innerHTML = `<div class="pane-inner">
          <h2>${esc(p.name || '(unnamed)')}</h2>
          <p class="sub">${esc(p.id ? `id ${p.id}` : 'new profile')}${
            p.restricted ? ' · hold to switch' : ''}</p>

          <div id="issues"></div>

          <div class="card plain">
            <h3>On the deck</h3>
            <div class="tiles">
              <figure><img id="prevOff" alt="" /><figcaption>inactive</figcaption></figure>
              <figure><img id="prevBusy" alt="" /><figcaption>switching</figcaption></figure>
              <figure><img id="prevOn" alt="" /><figcaption>active &amp; confirmed</figcaption></figure>
              <div class="tilenote">Rendered by the plugin itself, so what you see is what the
                key will show.</div>
            </div>
          </div>

          <div class="card">
            <h3>Identity</h3>
            <div class="row">
              <label for="pname">Name</label>
              <div class="grp">
                <input type="text" id="pname" data-f="name" value="${esc(p.name)}"
                       autocomplete="off" spellcheck="false" />
                <input type="color" data-f="color" value="${esc(p.color)}" title="Key colour" />
              </div>
            </div>
            <div class="row">
              <label>Avatar</label>
              <div class="grp">
                <img class="avatar-preview" id="avatarPreview" src="${p.avatarDataUri || ''}"
                     style="${p.avatarDataUri ? '' : 'visibility:hidden'}" alt="" />
                <input type="file" data-f="avatar" accept=".png,.jpg,.jpeg,.gif,.webp,.svg" />
                ${p.avatar ? '<button class="icon rm" data-act="rmavatar" title="Remove avatar">✕</button>' : ''}
              </div>
            </div>
            <div class="row">
              <label>Hold to switch</label>
              <div class="grp">
                <input type="checkbox" data-f="restricted" ${p.restricted ? 'checked' : ''} />
                <span class="muted">Requires a 1s press. Use for full-torque profiles.</span>
              </div>
            </div>
          </div>

          ${providerCardsHtml(p)}

          ${sceneRefsHtml(p)}
        </div>`;

        refreshPreview();
      }

      /**
       * The same renderer the deck uses, so an overflowing name or a colour that
       * swallows the label is visible here rather than after saving. Debounced:
       * this re-renders on every keystroke otherwise.
       */
      function refreshPreview() {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(async () => {
          const p = current();
          const off = $('prevOff');
          if (!p || !off) return;
          const reply = await ask('previewKey', {
            profile: { name: p.name, color: p.color, avatar: p.avatar },
          });
          if (!reply.off) return;
          off.src = reply.off;
          $('prevBusy').src = reply.busy;
          $('prevOn').src = reply.on;
        }, 200);
      }

      function renderSettings() {
        const devices = Array.isArray(hardware.goveeDevices)
          ? hardware.goveeDevices.join(', ') : (hardware.goveeDevices ?? '');

        // These three read as `!== false` on the provider side, so an absent key
        // means enabled. The boxes therefore start ticked when nothing has been
        // stored, and commit() writes a literal false when one is cleared —
        // saving `undefined` would silently turn the setting back on.
        const autoStart = hardware.fanatecAutoStart !== false;
        const closePit = hardware.mozaClosePitHouse !== false;
        const reopenPit = hardware.mozaReopenPitHouse === true;

        $('pane').innerHTML = `<div class="pane-inner">
          <h2>Settings</h2>
          <p class="sub">Applies to every profile. Stored on this machine only.</p>

          <div class="card" data-sec="fanatec-base">
            <h3>Fanatec wheelbase</h3>
            <div class="row">
              <label>FanatecService</label>
              <div class="grp">
                <input type="checkbox" id="fanatecAutoStart" ${autoStart ? 'checked' : ''} />
                <span class="muted">Start it when switching profiles</span>
              </div>
              <div class="help">
                The service is what actually applies a setup change. Without it the
                command is accepted by the broker and nothing happens — a switch that
                looks like it worked and did not. Turn this off only if you start the
                service yourself.
              </div>
            </div>
          </div>

          <div class="card" data-sec="moza">
            <h3>MOZA pedal</h3>
            <div class="row">
              <label>Pit House</label>
              <div class="grp">
                <input type="checkbox" id="mozaClose" ${closePit ? 'checked' : ''} />
                <span class="muted">Close it when switching profiles</span>
              </div>
              <div class="help">
                The pedal's serial port is exclusive, so Pit House has to be closed for a
                profile to reach the pedal at all. Turn this off only if you would rather
                close it by hand and have the switch fail on the times you forget.
              </div>
            </div>
            <div class="row">
              <label>Reopen afterwards</label>
              <div class="grp">
                <input type="checkbox" id="mozaReopen" ${reopenPit ? 'checked' : ''}
                       ${closePit ? '' : 'disabled'} />
                <span class="muted">Launch Pit House again once the profile is applied</span>
              </div>
              <div class="help">
                Worth leaving off. Pit House re-applies its own preset as it starts, which
                undoes the pedal settings the profile has just written.
              </div>
            </div>
          </div>

          <div class="card" data-sec="govee">
            <h3>Govee lighting</h3>
            <div class="row">
              <label for="goveeKey">API key</label>
              <div class="grp">
                <input type="password" id="goveeKey" autocomplete="off"
                       placeholder="${hardware.goveeApiKeySet ? '•••••••• (saved)' : 'not set'}" />
                <button id="goveeShow" class="icon" title="Show the key">👁</button>
              </div>
              <div class="help">${hardware.goveeApiKeySet
                ? 'A key is saved. Type a new one to replace it; leave blank to keep it. Saved when you click away from the field.'
                : 'Free key from developer.govee.com. Stored locally, never included in a YAML export. Saved when you click away from the field.'}</div>
            </div>
            <div class="row">
              <label for="goveeDevices">Only these devices</label>
              <input type="text" id="goveeDevices" placeholder="all devices" value="${esc(devices)}" />
              <div class="help">
                Optional. Comma-separated device names, so scenes do not fire at lamps
                elsewhere in the house.
              </div>
            </div>
            <div class="actions"><button id="goveeDiscover">Discover devices</button></div>
          </div>

          <div class="card" data-sec="yaml">
            <h3>Export YAML</h3>
            <p class="muted" style="margin-top:0">
              For version control. The Govee API key is never included. Editing
              <code>config/profiles.yaml</code> re-imports it over these profiles on the
              next start, so treat the file as a seed, not a copy.
            </p>
            <textarea class="yaml" id="yamlOut" spellcheck="false" readonly></textarea>
            <div class="actions"><button id="yamlCopy">Copy to clipboard</button></div>
          </div>
        </div>`;

        ask('exportYaml').then((r) => { const el = $('yamlOut'); if (el) el.value = r.yaml ?? ''; });
      }

      // =====================================================================
      // Right rail — everything you can DO, in one column
      // =====================================================================

      function renderRail() {
        const parts = [`<div class="rail-group"><div id="saveState" class="savecard"></div></div>`];

        if (view === 'settings') {
          parts.push(`<div class="rail-group"><h4>Jump to</h4>
            ${[['fanatec-base', 'Fanatec wheelbase'], ['moza', 'MOZA pedal'],
               ['govee', 'Govee lighting'], ['yaml', 'Export YAML']]
              .map(([sec, label]) =>
                `<button class="addbtn" data-jump="${sec}"><span class="nm">${esc(label)}</span></button>`)
              .join('')}</div>`);
          parts.push(`<div class="rail-group"><h4>Hardware</h4>
            <button id="refreshHardware" class="wide">Refresh options</button>
            <div class="savenote">Re-asks the wheelbase for its setup slots and Pit House for
              its presets.</div></div>`);
        } else {
          const p = current();
          const noun = kind === 'scenes' ? 'scene' : 'profile';
          if (p) {
            const available = providers.filter((prov) => !p.providers?.[prov.id]);
            parts.push(`<div class="rail-group"><h4>Add to this ${noun}</h4>${
              available.length
                ? available.map((prov) =>
                    `<button class="addbtn" data-addprov="${esc(prov.id)}">
                       <span class="plus">+</span>
                       <span class="nm">${esc(prov.label)}${
                         prov.verifiable ? '' : '<i>cannot be confirmed</i>'}</span>
                     </button>`).join('')
                : `<div class="savenote">Everything available is already on this ${noun}.</div>`
            }</div>`);

            // What deleting costs, stated before it is clicked rather than in
            // the confirm box alone: for a scene that is the profiles that
            // reference it, which is the thing you cannot see from here.
            const users = kind === 'scenes' && p.id ? profilesUsingScene(profiles, p.id) : [];
            const cost = kind === 'scenes'
              ? users.length
                ? `Used by ${users.length} profile${users.length === 1 ? '' : 's'}: ${
                    esc(users.map((u) => u.name || u.id).join(', '))}. Deleting it removes it
                    from them; they keep everything else.`
                : 'No profile references it.'
              : 'Keys bound to it stop working.';

            parts.push(`<div class="rail-group"><h4>This ${noun}</h4>
              <button class="danger wide" data-act="remove">Delete ${noun}</button>
              <div class="savenote">${p.id
                ? `Stored as <code>${esc(p.id)}</code>. ${cost}`
                : 'Not saved yet.'}</div></div>`);
          } else {
            parts.push(`<div class="rail-group"><h4>${kind === 'scenes' ? 'Scenes' : 'Profiles'}</h4>
              <button class="addbtn" id="addRail"><span class="plus">+</span>
                <span class="nm">New ${noun}</span></button></div>`);
          }
        }

        $('rail').innerHTML = parts.join('');
        renderSaveState();
      }

      // =====================================================================
      // Edits
      // =====================================================================

      // Profiles and scenes are edited by the same handler because they are
      // edited through the same fields: a scene simply never renders the ones
      // that are profile-only, so those branches never fire for it.
      function onRecordInput(e) {
        const el = e.target;
        const p = current();
        if (!p) return;

        // Ticking a scene this profile also runs. Stored as an id, so renaming
        // the scene later cannot break the reference.
        if (el.dataset.sceneref) {
          setSceneRef(p, el.dataset.sceneref, el.checked);
          // Re-rendered rather than toggled in place: ticking a scene can
          // reveal a provider clash on that row, and the sidebar's "+2 scenes"
          // count moves too.
          render();
          touch('draft');
          return;
        }

        // Enabling or disabling one slider.
        if (el.dataset.fldon) {
          const [providerId, key] = el.dataset.fldon.split('|');
          const cfg = (p.providers[providerId] = p.providers[providerId] ?? {});
          const slider = document.querySelector(`input[type="range"][data-fld="${el.dataset.fldon}"]`);
          const readout = document.querySelector(`[data-rv="${el.dataset.fldon}"]`);
          const unit = readout?.dataset.unit ?? '';
          if (el.checked) {
            cfg[key] = Number(slider.value);
            slider.disabled = false;
            readout.textContent = slider.value + unit;
            readout.classList.remove('off');
          } else {
            delete cfg[key];
            slider.disabled = true;
            readout.textContent = 'not set';
            readout.classList.add('off');
          }
          touch('draft');
          return;
        }

        if (el.dataset.fld) {
          const [providerId, key] = el.dataset.fld.split('|');
          const cfg = (p.providers[providerId] = p.providers[providerId] ?? {});
          const value = fieldValue(el.type === 'checkbox' ? el.checked : el.value);
          if (value === undefined) delete cfg[key];
          else cfg[key] = value;
          const readout = document.querySelector(`[data-rv="${el.dataset.fld}"]`);
          if (readout && el.type === 'range') readout.textContent = el.value + (readout.dataset.unit ?? '');
          delete p.needsWheelbaseSetup;
          touch('draft');
          return;
        }

        const field = el.dataset.f;
        if (!field) return;
        if (field === 'name') {
          p.name = el.value;
          // Only the heading and the list row — re-rendering the pane on every
          // keystroke would steal focus mid-word.
          $('pane').querySelector('h2').textContent = p.name || '(unnamed)';
          renderList();
          refreshPreview();
          touch('draft');
        } else if (field === 'color') {
          p.color = el.value;
          renderList();
          refreshPreview();
          touch('draft');
        } else if (field === 'restricted') {
          p.restricted = el.checked;
          touch('draft');
        } else if (field === 'avatar' && el.files?.[0]) {
          uploadAvatar(p, el.files[0]);
        }
      }

      function onSettingsInput(e) {
        const el = e.target;
        if (el.id === 'goveeKey') {
          // Deliberately not saved per keystroke: saveSettings treats a blank
          // key as "leave it alone", so an autosave halfway through typing
          // would replace a working key with a fragment of a new one. Marked
          // dirty on every keystroke all the same, so the state on screen and
          // the unload warning are both honest.
          hardware.goveeApiKey = el.value.trim();
          touch('settings', { defer: e.type === 'input' });
          return;
        }
        if (el.id === 'goveeDevices') {
          const raw = el.value.trim();
          hardware.goveeDevices = raw ? raw.split(',').map((x) => x.trim()).filter(Boolean) : null;
          touch('settings');
          return;
        }
        if (el.id === 'fanatecAutoStart') {
          hardware.fanatecAutoStart = el.checked;
          touch('settings');
          return;
        }
        if (el.id === 'mozaClose') {
          hardware.mozaClosePitHouse = el.checked;
          // Reopening only means anything if we closed it. Toggled in place
          // rather than by re-rendering, which would wipe a half-typed API key.
          const reopen = $('mozaReopen');
          if (reopen) reopen.disabled = !el.checked;
          touch('settings');
          return;
        }
        if (el.id === 'mozaReopen') {
          hardware.mozaReopenPitHouse = el.checked;
          touch('settings');
        }
      }

      async function uploadAvatar(p, file) {
        if (!p.id) p.id = slugify(p.name, profiles.map((d) => d.id).filter(Boolean));
        const base64 = await new Promise((res) => {
          const r = new FileReader();
          r.onload = () => res(String(r.result).split(',')[1]);
          r.readAsDataURL(file);
        });
        const reply = await ask('uploadAvatar', { profileId: p.id, base64, filename: file.name });
        if (!reply.ok) return say(reply.error, 'err');

        p.avatar = reply.filename;
        p.avatarDataUri = (await ask('getAvatar', { profileId: p.id, filename: reply.filename })).dataUri;
        say('Avatar stored.', 'ok');
        render();
        touch('draft', { now: true });
      }

      async function removeAvatar(p) {
        if (p.avatar) await ask('deleteAvatar', { profileId: p.id, filename: p.avatar });
        delete p.avatar;
        delete p.avatarDataUri;
        render();
        touch('draft', { now: true });
      }

      /**
       * Delete a scene, saying first what else it takes with it.
       *
       * A profile references a scene by id, so deleting one out from under a
       * profile would leave a reference to nothing: the profile would still
       * claim to run the scene, the runtime would skip it with a log line
       * nobody reads, and the lights would simply not come on. Two things stop
       * that. The confirm names every profile that references it — so the
       * decision is made with the cost visible — and the references are then
       * removed, so no profile is left pointing at a scene that is gone.
       */
      function deleteScene(s) {
        const users = s.id ? profilesUsingScene(profiles, s.id) : [];
        const warning = users.length
          ? `\n\nIt is used by ${users.length} profile${users.length === 1 ? '' : 's'}: ` +
            `${users.map((p) => p.name || p.id).join(', ')}.\n` +
            `They will stop running it. Everything else about them is unchanged.`
          : '';
        if (!confirm(`Delete the scene "${s.name}"?${warning}`)) return;

        const detached = detachScene(profiles, s.id);
        ({ profiles: scenes, selected: selectedScene } = removeProfile(scenes, s));
        render();
        touch('draft', { now: true });
        say(
          detached.length
            ? `Scene deleted, and removed from ${detached.map((p) => p.name || p.id).join(', ')}.`
            : 'Scene deleted.',
          'ok',
        );
      }

      /** Show a settings section and say which one, for a link from a provider. */
      function gotoSettings(section) {
        view = 'settings';
        render();
        const target = document.querySelector(`[data-sec="${section}"]`);
        if (!target) return;
        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
        target.classList.remove('flash');
        void target.offsetWidth;              // restart the animation
        target.classList.add('flash');
      }

      // =====================================================================
      // Load
      // =====================================================================

      async function loadProfiles() {
        const reply = await ask('getProfiles');
        if (reply.ok === false) return say(reply.error, 'err');
        profiles = reply.profiles ?? [];
        scenes = reply.scenes ?? [];
        hardware = reply.settings ?? {};
        for (const p of profiles) {
          if (!p.providers) p.providers = {};
          if (p.avatar) {
            p.avatarDataUri = (await ask('getAvatar', { profileId: p.id, filename: p.avatar })).dataUri;
          }
        }
        // No avatars on scenes: a scene is not a person. Only the providers map
        // needs defaulting, so an older record without one still edits.
        for (const s of scenes) if (!s.providers) s.providers = {};
        selectedProfile = keepSelection(profiles, selectedProfile);
        selectedScene = keepSelection(scenes, selectedScene);
      }

      async function loadProviders() {
        // Schemas with live hardware options folded in — the wheelbase is asked
        // for its slots here, which is why this costs a moment on a cold base.
        const reply = await ask('getProviders');
        providers = reply.providers ?? [];
      }

      // =====================================================================
      // Wire
      // =====================================================================

      $('search').addEventListener('input', renderList);

      $('seg').addEventListener('click', (e) => {
        const b = e.target.closest('[data-kind]');
        if (b && b.dataset.kind !== kind) setKind(b.dataset.kind);
      });

      /** The record a sidebar row stands for, or null. Whichever list is shown. */
      const rowRecord = (target) => {
        const li = target.closest?.('li[data-i]');
        return li ? listOf()[Number(li.dataset.i)] ?? null : null;
      };

      $('list').addEventListener('click', (e) => {
        const p = rowRecord(e.target);
        if (!p) return;
        select(p);
        view = 'editor';
        render();
      });

      // Drag to reorder. Order is what the inspector's dropdown shows, so it is
      // worth arranging: the profiles used daily belong at the top.
      let dragging = null;
      $('list').addEventListener('dragstart', (e) => {
        dragging = rowRecord(e.target);
        if (dragging) e.dataTransfer.effectAllowed = 'move';
      });
      $('list').addEventListener('dragover', (e) => {
        const li = e.target.closest('li[data-i]');
        if (!li || !dragging) return;
        e.preventDefault();
        const after = e.offsetY > li.offsetHeight / 2;
        document.querySelectorAll('#list li').forEach((n) =>
          n.classList.remove('drop-before', 'drop-after'));
        li.classList.add(after ? 'drop-after' : 'drop-before');
      });
      $('list').addEventListener('drop', (e) => {
        const li = e.target.closest('li[data-i]');
        const onto = rowRecord(e.target);
        if (!onto || !dragging) return;
        e.preventDefault();
        const moved = moveProfile(listOf(), dragging, onto, e.offsetY > li.offsetHeight / 2);
        if (kind === 'scenes') scenes = moved;
        else profiles = moved;
        dragging = null;
        render();
        touch('draft');
      });

      // A drag released outside the list leaves its insertion marker behind.
      $('list').addEventListener('dragend', () => {
        dragging = null;
        document.querySelectorAll('#list li').forEach((n) =>
          n.classList.remove('drop-before', 'drop-after'));
      });

      /** Add to whichever list is showing, and land the caret in its name. */
      function newRecord() {
        if (kind === 'scenes') ({ scenes, selected: selectedScene } = addScene(scenes));
        else ({ profiles, selected: selectedProfile } = addProfile(profiles));
        view = 'editor';
        render();
        // Focused and selected so the first keystroke names it. The id is
        // slugged from this name, and commit() waits for the field to be left.
        const name = $('pname');
        name?.focus();
        name?.select();
        touch('draft');
      }

      $('add').addEventListener('click', newRecord);
      $('navSettings').addEventListener('click', () => { view = 'settings'; render(); });

      $('pane').addEventListener('input', paneEdit);
      $('pane').addEventListener('change', paneEdit);
      function paneEdit(e) {
        if (view === 'settings') onSettingsInput(e);
        else onRecordInput(e);
      }

      // Enter in the key field means "I am done with this", same as clicking away.
      $('pane').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.id === 'goveeKey') { e.preventDefault(); commit(); }
      });

      $('pane').addEventListener('click', async (e) => {
        const p = current();
        const goto = e.target.closest('[data-goto]');
        if (goto) return gotoSettings(goto.dataset.goto);

        // A chip on the scene's "Used by" list: go and look at that profile.
        const useby = e.target.closest('[data-useby]');
        if (useby) {
          const owner = profiles.find((x) => x.id === useby.dataset.useby);
          if (owner) {
            selectedProfile = owner;
            setKind('profiles');
          }
          return;
        }

        const rm = e.target.closest('[data-rmprov]');
        if (rm && p) {
          delete p.providers[rm.dataset.rmprov];
          render();
          touch('draft');
          return;
        }
        if (e.target.closest('[data-act="rmavatar"]') && p) return removeAvatar(p);

        if (e.target.id === 'goveeShow') {
          const f = $('goveeKey');
          f.type = f.type === 'password' ? 'text' : 'password';
          return;
        }
        if (e.target.id === 'goveeDiscover') {
          say('Discovering… (a few seconds per device)');
          const reply = await ask('goveeDiscover');
          if (!reply.ok) return say(reply.error ?? 'discovery failed', 'err');
          say(`${reply.devices.length} device(s), ${reply.scenes.length} scene(s): ` +
              reply.devices.map((d) => d.name).join(', '), 'ok');
          // Scene dropdowns come from provider schemas, so refresh them.
          await loadProviders();
          return;
        }
        if (e.target.id === 'yamlCopy') {
          navigator.clipboard?.writeText($('yamlOut').value)
            .then(() => say('Copied.', 'ok'), () => say('Select the text and copy it.', 'err'));
        }
      });

      $('rail').addEventListener('click', async (e) => {
        const p = current();

        const add = e.target.closest('[data-addprov]');
        if (add && p) {
          p.providers = p.providers ?? {};
          p.providers[add.dataset.addprov] = {};
          render();
          touch('draft');
          // Land the user on what they just added rather than leaving it to be
          // hunted for at the bottom of a long profile.
          const card = document.querySelector(`[data-hw="${CSS.escape(add.dataset.addprov)}"]`);
          card?.scrollIntoView({ block: 'center', behavior: 'smooth' });
          card?.classList.add('flash');
          return;
        }

        const jump = e.target.closest('[data-jump]');
        if (jump) return gotoSettings(jump.dataset.jump);

        if (e.target.id === 'addRail') return newRecord();
        if (e.target.id === 'saveNow') return commit();

        if (e.target.closest('[data-act="remove"]') && p) {
          if (kind === 'scenes') return deleteScene(p);
          if (!confirm(`Delete "${p.name}"? Keys bound to it will stop working.`)) return;
          ({ profiles, selected: selectedProfile } = removeProfile(profiles, p));
          render();
          touch('draft', { now: true });
          return;
        }

        if (e.target.id === 'refreshHardware') {
          say('Asking the hardware…');
          await loadProviders();
          say('Hardware options refreshed.', 'ok');
        }
      });

      // A change still in the page is a change that would be lost. With
      // autosave this only fires while a save is in flight, held for a name, or
      // blocked by a validation error — all of which are worth stopping for.
      window.addEventListener('beforeunload', (e) => {
        if (!isDirty()) return;
        e.preventDefault();
        e.returnValue = '';
      });

      // Leaving the page in any other way is the natural moment to flush.
      window.addEventListener('blur', () => { if (isDirty() && !namingInProgress()) commit(); });

      /**
       * The event stream is how the plugin knows a page is still open — closing
       * this tab is what stops the server. It carries no data, so losing it just
       * means the editor is no longer live.
       */
      function connect() {
        const es = new EventSource(`/events${q}`);
        es.onopen = () => {
          $('dot').className = 'dot live';
          $('conn').textContent = 'connected';
        };
        es.onerror = () => {
          $('dot').className = 'dot gone';
          $('conn').textContent = 'disconnected — reopen from the Stream Deck';
        };
      }

      (async () => {
        connect();
        await loadProfiles();
        // Through setKind so the selector, the search placeholder and the line
        // explaining what a profile is are all set from the one place that
        // knows, rather than being duplicated in the markup and drifting.
        setKind('profiles');
        await loadProviders();
        render();
      })();
    </script>
  </body>
</html>
