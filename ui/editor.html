<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rig Profiles</title>
    <style>
      /* Three rails, fixed roles, and nothing that moves between them:
         LEFT is what you are editing, CENTRE is the thing itself, RIGHT is
         what you can do to it. Actions used to be scattered across the header,
         the bottom of a form and the middle of a card, and the complaint that
         "add hardware gets lost at the end" was really a complaint that there
         was nowhere for an action to live. Now there is. */
      :root {
        color-scheme: dark;

        --bg: #17181b;
        --panel: #1c1e22;
        --rail: #1a1c20;
        --card: #232529;
        --raise: #292c32;
        --line: #33363d;
        --hair: #2a2d33;

        --fg: #e6e8ec;
        --dim: #a2a8b3;
        --faint: #767c88;

        --accent: #4c8dff;
        --accent-deep: #2f6fe0;
        --green: #46b95a;
        --amber: #e3b341;
        --red: #f16a60;

        /* Modes get their own accent, and it is not decoration. A profile and
           a Mode are the same shape and behave completely differently — one
           says who is at the rig, the other flashes some lights — so the
           editor never lets you be unsure which one is under the cursor. The
           segmented control says it in words; the violet says it at a glance. */
        --mode: #a077ff;
        --mode-deep: #7a4fe0;

        --r: 10px;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font: 13.5px/1.55 -apple-system, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        color: var(--fg); background: var(--bg); margin: 0;
        display: flex; flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
      ::selection { background: #2f4a80; }

      /* ------------------------------------------------------------ header */
      header {
        display: flex; align-items: center; gap: 10px;
        padding: 0 16px; height: 46px; flex: 0 0 auto;
        background: var(--panel); border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 13px; margin: 0; font-weight: 650; letter-spacing: 0.4px;
        text-transform: uppercase; color: var(--fg);
      }
      header .spacer { flex: 1; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; }
      .dot.live { background: var(--green); box-shadow: 0 0 0 3px rgba(70, 185, 90, 0.15); }
      .dot.gone { background: var(--red); box-shadow: 0 0 0 3px rgba(241, 106, 96, 0.15); }
      .conn { color: var(--faint); font-size: 12px; }

      /* ------------------------------------------------------------- rails */
      main {
        flex: 1; min-height: 0;
        display: grid; grid-template-columns: 268px minmax(420px, 1fr) 264px;
      }
      aside {
        background: var(--rail); display: flex; flex-direction: column;
        min-height: 0; min-width: 0;
      }
      #railLeft { border-right: 1px solid var(--line); }
      #rail { border-left: 1px solid var(--line); overflow: hidden; }
      #railBody { overflow-y: auto; padding: 6px 12px 20px; flex: 1; min-height: 0; }

      .rail-head {
        display: flex; align-items: center; gap: 8px;
        padding: 12px 12px 8px; flex: 0 0 auto;
      }
      .rail-title {
        font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
        text-transform: uppercase; color: var(--faint); flex: 1;
      }
      .rail-group + .rail-group { margin-top: 16px; }
      .rail-group > h4 {
        margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
        text-transform: uppercase; color: var(--faint);
      }

      /* --------------------------------------------------- kind selector */
      /* One list at a time, and a permanent label saying which. Two stacked
         lists were the alternative and were rejected: with both on screen the
         only thing distinguishing "delete this profile" from "delete this
         Mode" is which heading you scrolled past, and these two do not
         deserve to be told apart by memory. */
      .seg {
        display: flex; gap: 2px; margin: 0 12px 8px; padding: 2px;
        background: #202227; border: 1px solid var(--hair); border-radius: 9px;
      }
      .seg button {
        flex: 1; background: none; border: 1px solid transparent; color: var(--dim);
        padding: 6px 8px; border-radius: 7px; font: inherit; font-size: 12.5px;
        font-weight: 600; cursor: pointer;
      }
      .seg button:hover { background: #292c32; color: var(--fg); }
      .seg button.on { background: var(--accent-deep); border-color: #3f7ae8; color: #fff; }
      .seg button.on[data-kind="modes"] { background: var(--mode-deep); border-color: #8d63ea; }
      /* The one line that explains the difference, where the choice is made. */
      .segnote {
        padding: 0 13px 10px; color: var(--faint); font-size: 11.5px; line-height: 1.45;
      }

      /* ---------------------------------------------------- profile list */
      .pad { padding: 0 12px 10px; flex: 0 0 auto; }
      #list { list-style: none; margin: 0; padding: 0 8px 8px; overflow-y: auto; flex: 1; min-height: 0; }
      #list li {
        display: flex; align-items: center; gap: 9px; padding: 7px 8px;
        border-radius: 8px; cursor: pointer; margin-bottom: 2px;
        border: 1px solid transparent; position: relative;
      }
      #list li:hover { background: #24262b; }
      #list li.sel { background: #26334d; border-color: #38507e; }
      #list li.sel .who b { color: #fff; }
      #list li.drop-before { box-shadow: 0 -2px 0 var(--accent); }
      #list li.drop-after { box-shadow: 0 2px 0 var(--accent); }
      #list li.empty { cursor: default; color: var(--faint); font-size: 12px; padding: 12px 8px; }
      /* "+ New" sits at the END of the list rather than pinned to the bottom of
         the rail, because it is the next row — after the last profile, not in a
         different place from it. A search that shortens the list brings it up
         with the rows, which is also where the eye already is. */
      #list li.newrow { padding: 4px 0 0; cursor: default; background: none; }
      #list li.newrow:hover { background: none; }
      #list li.newrow button {
        width: 100%; text-align: left; background: none; border: 1px dashed #3c4048;
        color: var(--dim); padding: 7px 9px; border-radius: 8px; font: inherit; font-size: 12.5px;
      }
      #list li.newrow button:hover { background: #24262b; color: var(--fg); border-color: #4c515b; }
      #list li.newrow button b { color: var(--accent); font-weight: 700; }
      body.editing-mode #list li.newrow button b { color: var(--mode); }
      #list .grip { color: #4a4d55; cursor: grab; flex: 0 0 auto; font-size: 12px; }
      #list li:hover .grip { color: #6d717a; }
      #list .who { flex: 1; min-width: 0; }
      #list .who b { display: block; font-weight: 600; font-size: 13px;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #list .who span { display: block; color: var(--faint); font-size: 11px;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #list .bad { color: var(--red); font-weight: 700; flex: 0 0 auto; }

      /* The swatch doubles as the accessibility demo: its initial is drawn in
         whichever ink actually reads against the chosen colour. */
      .swatch {
        width: 28px; height: 28px; border-radius: 7px; flex: 0 0 auto;
        background-size: cover; background-position: center;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 700; line-height: 1;
      }
      .swatch.photo { color: transparent; }

      nav { border-top: 1px solid var(--hair); padding: 8px; flex: 0 0 auto; }
      .navbtn {
        display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
        background: none; border: 1px solid transparent; color: var(--dim);
        padding: 8px 9px; border-radius: 8px; font: inherit; cursor: pointer;
      }
      .navbtn:hover { background: #24262b; color: var(--fg); }
      .navbtn.sel { background: #26334d; border-color: #38507e; color: #fff; }
      .navbtn .ico { font-size: 14px; width: 16px; text-align: center; }

      /* ------------------------------------------------------------- pane */
      section#pane { overflow-y: auto; padding: 22px 28px 40px; min-width: 0; }
      .pane-inner { max-width: 780px; }

      /* The heading IS the name field. There was a title at the top of the pane
         and a "Name" box a few centimetres below it, both showing the same
         string, and the second one existed only because the first was not
         editable. One thing on screen, edited where it is read. */
      .pane-top {
        display: flex; align-items: flex-start; gap: 10px; margin: 0 0 18px;
      }
      .titlewrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; flex: 1; }
      #pane h2 {
        margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -0.2px;
        overflow-wrap: anywhere; min-width: 60px;
      }
      h2.editable {
        padding: 2px 8px; margin-left: -8px; border-radius: 7px;
        border: 1px solid transparent; cursor: text;
      }
      h2.editable:hover { background: #1f2126; border-color: var(--hair); }
      h2.editable:focus {
        outline: none; background: #1b1d21; border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(76, 141, 255, 0.16);
      }
      body.editing-mode h2.editable:focus {
        border-color: var(--mode); box-shadow: 0 0 0 3px rgba(160, 119, 255, 0.16);
      }
      /* An empty heading is a name that has been cleared, which the server will
         refuse. Say so in the space where the name should be. */
      h2.editable:empty::before {
        content: "Name this " attr(data-noun); color: var(--faint); font-weight: 400;
      }
      .pill {
        font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
        border-radius: 20px; padding: 2px 8px; white-space: nowrap;
        color: var(--mode); border: 1px solid #55408a; background: rgba(160, 119, 255, 0.1);
      }
      .pill.hold {
        color: var(--amber); border-color: #5f4c1f; background: rgba(227, 179, 65, 0.1);
      }

      /* ----------------------------------------------------------- cog menu */
      /* The things you do to this record rather than the record itself: the id
         it is stored under, the hold gate, and deleting it. They were spread
         across a subtitle, a form row and the far column; none of them is
         something you look at while editing, and one of them is destructive. */
      .cogwrap { position: relative; flex: 0 0 auto; }
      #cog {
        background: none; border: 1px solid transparent; color: var(--dim);
        padding: 5px 9px; border-radius: 7px; font-size: 15px; line-height: 1;
      }
      #cog:hover, .cogwrap.open #cog { background: #2f3238; border-color: #3f434b; color: var(--fg); }
      .cogmenu {
        position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
        width: 296px; padding: 12px 13px;
        background: var(--raise); border: 1px solid var(--line); border-radius: var(--r);
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.5);
      }
      .cogwrap:not(.open) .cogmenu { display: none; }
      .cogmenu h4 {
        margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
        text-transform: uppercase; color: var(--faint);
      }
      .cogmenu .grp { display: flex; align-items: flex-start; gap: 9px; }
      .cogmenu .sep { border-top: 1px solid var(--line); margin: 11px -13px; }
      .cogmenu code {
        background: #1b1d21; border: 1px solid var(--hair); border-radius: 5px;
        padding: 1px 6px; font-size: 12px;
      }

      /* -------------------------------------------------- save status strip */
      /* In the main column, right-aligned, level with the name: the status of
         the thing you are looking at belongs beside the thing you are looking
         at, not in a column of unrelated actions. */
      .savestrip {
        display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
        flex: 0 0 auto; max-width: 260px; text-align: right; padding-top: 4px;
      }
      .savestrip .savenote { margin-top: 0; }
      .savestrip button { margin-top: 4px; padding: 4px 10px; font-size: 12px; }

      /* Backup, restore and the offer. */
      .offerbar {
        grid-column: 1 / -1;
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        flex-wrap: wrap;
        margin: 0 0 12px; padding: 12px 16px;
        border: 1px solid #8a6d1f; border-radius: 8px;
        background: #2b2410; color: #f0e6c8;
      }
      /* display:flex beats [hidden]'s display:none, so say it explicitly.
         Without this the bar sits there empty on every healthy load. */
      .offerbar[hidden] { display: none; }
      .offerbar .actions { margin: 0; }
      .dropzone {
        margin-top: 12px; padding: 18px; text-align: center;
        border: 2px dashed #3a3a3a; border-radius: 8px; color: #aaa;
      }
      .dropzone.over { border-color: #5b8dd6; background: #1b2331; color: #dbe7f7; }
      .dropzone .help { margin: 6px 0; }
      .preview {
        margin-top: 12px; padding: 12px 14px;
        border: 1px solid #3a3a3a; border-left: 3px solid #5b8dd6; border-radius: 6px;
        background: #191919;
      }
      .warn {
        margin-top: 12px; padding: 10px 14px;
        border: 1px solid #7a3b3b; border-radius: 6px; background: #2a1a1a; color: #f0c8c8;
      }
      .histrow {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 8px 0; border-bottom: 1px solid #2a2a2a;
      }
      .histrow:last-child { border-bottom: 0; }
      .card {
        background: var(--card); border: 1px solid var(--line);
        border-radius: var(--r); padding: 14px 16px 4px; margin-bottom: 14px;
        box-shadow: var(--shadow);
      }
      .card > h3 {
        margin: 0 0 12px; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.8px; color: var(--faint); font-weight: 700;
      }
      .card.plain { padding-bottom: 14px; }

      /* Hardware/app blocks read as separate things you added, not as one long
         form: own surface, own header strip, own accent edge. */
      .hw {
        background: var(--card); border: 1px solid var(--line);
        border-radius: var(--r); margin-bottom: 12px; overflow: hidden;
        box-shadow: var(--shadow); position: relative;
      }
      .hw::before {
        content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
        background: var(--accent-deep);
      }
      .hw-head {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 12px 10px 15px; background: var(--raise);
        border-bottom: 1px solid var(--line);
      }
      .hw-head .pname { font-weight: 650; font-size: 13.5px; }
      /* What this block is set to, shown only where the label is not enough on
         its own: a record holding two "Rig State Flag" blocks. Beside the name
         rather than under it, so the head stays one line tall and the two
         blocks differ where the eye is already looking. */
      .hw-head .pname i {
        font-style: normal; font-weight: 400; color: var(--faint); font-size: 12px;
        margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--line);
      }
      .hw-body { padding: 13px 16px 4px 15px; }
      .hw-body:empty { display: none; }
      .hw.flash { animation: flash 1.1s ease-out; }
      .card.flash { animation: flash 1.1s ease-out; }
      @keyframes flash {
        0%, 40% { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(76, 141, 255, 0.18); }
        100% { border-color: var(--line); box-shadow: var(--shadow); }
      }

      .badge {
        font-size: 10.5px; color: var(--faint); border: 1px solid var(--line);
        border-radius: 20px; padding: 1px 8px; white-space: nowrap;
      }
      .badge.bad { color: var(--amber); border-color: #5f4c1f; background: rgba(227, 179, 65, 0.1); }

      /* -------------------------------------------- values that have gone away
         A stored value its provider can no longer explain — a Pit House preset
         repackaged out from under the profile, a Govee scene renamed in the
         Govee app. Amber, not red: nothing is broken and nothing is refused.
         The profile still saves and the value is still exactly what it was.
         What has gone is the ability to edit it meaningfully. */
      .hw.locked::before { background: var(--amber); }
      .lostbanner {
        background: rgba(227, 179, 65, 0.08); border: 1px solid #5f4c1f;
        border-left-width: 3px; border-radius: 8px; padding: 9px 12px; margin: 0 0 14px;
        color: #e6d3a8; font-size: 12.5px; line-height: 1.5;
      }
      .lostbanner b { display: block; color: var(--amber); margin-bottom: 3px; }
      /* The raw stored value, shown as itself. It is a uuid or a name from
         another app's database, and with the option gone it is the only
         identifying information left — so it is selectable text, not a label. */
      .lostval {
        display: inline-block; max-width: 100%; overflow-wrap: anywhere;
        background: #1b1d21; border: 1px solid #5f4c1f; border-radius: 7px;
        padding: 6px 9px; font-size: 12px; color: var(--fg); user-select: all;
      }
      .help.lost { color: #c9b183; }

      /* ------------------------------------------- blocks holding nothing yet
         The third state, and the one this palette has to keep separate from the
         other two. `unavailable` is amber and means a value that is GONE;
         `unchecked` is quiet and means a value that could not be verified. A
         block that has never held a value is neither, so it borrows neither
         colour. Accent while it is still being filled in — the same blue as
         "+ add", because it is the same act, unfinished — and red only once the
         user has plainly walked away from it. */
      .hw.blank::before { background: #3f434b; }
      .badge.todo { color: var(--accent); border-color: #2c4675; background: rgba(76, 141, 255, 0.1); }
      body.editing-mode .hw.blank::before { background: #3f434b; }
      body.editing-mode .badge.todo {
        color: var(--mode); border-color: #55408a; background: rgba(160, 119, 255, 0.1);
      }
      .newbanner {
        border: 1px dashed #3c4048; border-radius: 8px; padding: 9px 12px; margin: 0 0 14px;
        color: var(--dim); font-size: 12.5px; line-height: 1.5;
      }

      /* Left blank on purpose, now. Same red as a save failure, because the
         consequence is the same shape: something on screen is not in the store.
         It is worded as what happened rather than as a refusal — the record
         saved perfectly well, without this. */
      .hw.unset::before, body.editing-mode .hw.unset::before { background: var(--red); }
      .badge.unset, body.editing-mode .badge.unset {
        color: var(--red); border-color: #6b3b37; background: rgba(241, 106, 96, 0.1);
      }
      .unsetbanner {
        background: #2a1f21; border: 1px solid #6b3b37; border-left-width: 3px;
        border-radius: 8px; padding: 9px 12px; margin: 0 0 14px;
        color: #e2b7b3; font-size: 12.5px; line-height: 1.5;
      }
      .unsetbanner b { color: var(--red); }
      .issues.unset p { margin: 0; color: #e2b7b3; font-size: 12.5px; }
      .issues + .issues { margin-top: -8px; }
      #list .warn { color: var(--amber); font-weight: 700; flex: 0 0 auto; }
      .state.holding .dot { background: var(--amber); }

      /* A locked control keeps its value legible. Greyed enough to say "not
         now", not so far that you cannot read what the profile is set to. */
      input:disabled, select:disabled, textarea:disabled { opacity: 0.55; cursor: not-allowed; }
      input[type="checkbox"]:disabled { cursor: not-allowed; }
      /* A disabled slider normally means "this setting is not set on this
         profile", which is why it fades almost out. Inside a locked block it
         means something else entirely — the value IS set, it just cannot be
         changed right now — so it stays as readable as the rest. */
      .hw.locked input[type="range"]:disabled { opacity: 0.55; }
      .cfglink {
        font-size: 11.5px; color: var(--accent); background: none; border: none;
        padding: 2px 6px; border-radius: 5px; cursor: pointer; font-family: inherit;
        white-space: nowrap;
      }
      .cfglink:hover { background: rgba(76, 141, 255, 0.12); }

      /* ------------------------------------------------------------ fields */
      .row {
        display: grid; grid-template-columns: 156px minmax(0, 1fr);
        align-items: center; gap: 10px; margin-bottom: 10px;
      }
      .row > label { color: var(--dim); font-size: 12.5px; }
      .row .grp { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .help {
        grid-column: 2; margin: -6px 0 10px; color: var(--faint);
        font-size: 11.5px; line-height: 1.45;
      }
      .muted { color: var(--faint); font-size: 12px; }

      input[type="text"], input[type="password"], input[type="search"], select, textarea {
        background: #1b1d21; color: var(--fg); border: 1px solid #3a3d44;
        border-radius: 7px; padding: 7px 9px; font: inherit; width: 100%; min-width: 0;
      }
      input[type="text"]:hover, input[type="password"]:hover, select:hover { border-color: #4a4e57; }
      input::placeholder { color: #61666f; }
      select { cursor: pointer; }
      input[type="color"] {
        width: 40px; height: 34px; padding: 2px; background: #1b1d21;
        border: 1px solid #3a3d44; border-radius: 7px; flex: 0 0 auto; cursor: pointer;
      }
      input[type="checkbox"] {
        width: 16px; height: 16px; flex: 0 0 auto; accent-color: var(--accent-deep); cursor: pointer;
      }
      input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent-deep); }
      input[type="range"]:disabled { opacity: 0.3; }
      input[type="file"] { font-size: 12px; color: var(--dim); flex: 1; min-width: 0; }
      input[type="file"]::file-selector-button {
        background: #34373e; color: var(--fg); border: 1px solid #43464e;
        border-radius: 6px; padding: 5px 10px; margin-right: 10px; font: inherit; cursor: pointer;
      }
      textarea { font-family: ui-monospace, Consolas, monospace; font-size: 12px; resize: vertical; }
      textarea.cmds { height: 104px; }
      textarea.yaml { height: 360px; }
      .rv {
        flex: 0 0 82px; text-align: right; font-variant-numeric: tabular-nums;
        font-size: 12px; color: var(--dim);
      }
      .rv.off { color: #5d626b; }

      /* ----------------------------------------------------------- buttons */
      button {
        background: #2f3238; color: var(--fg); border: 1px solid #3f434b;
        border-radius: 7px; padding: 7px 12px; font: inherit; cursor: pointer;
      }
      button:hover { background: #383c43; border-color: #4a4e57; }
      button:active { transform: translateY(1px); }
      button.primary { background: var(--accent-deep); border-color: #3f7ae8; color: #fff; font-weight: 600; }
      button.primary:hover { background: #3a7bef; }
      button.danger { color: #f0a49d; border-color: #5c3a37; background: #2b2224; }
      button.danger:hover { background: #3a2a2b; border-color: #7a4b46; }
      button.wide { width: 100%; }
      button.icon {
        background: none; border: none; color: var(--faint); padding: 4px 7px;
        border-radius: 6px; line-height: 1;
      }
      button.icon:hover { background: #34373e; color: var(--fg); }
      button.icon.rm:hover { color: var(--red); }
      .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }

      /* "+ thing" rather than a dropdown: the choices are few, and a list of
         buttons says "these are the things you can add" without being opened. */
      .addbtn {
        display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
        background: #212328; border: 1px solid var(--hair); border-radius: 8px;
        padding: 8px 10px; margin-bottom: 6px; color: var(--fg); font: inherit; cursor: pointer;
      }
      .addbtn:hover { background: #282b31; border-color: #43474f; }
      .addbtn .plus { color: var(--accent); font-weight: 700; font-size: 14px; flex: 0 0 auto; }
      .addbtn .nm { flex: 1; min-width: 0; font-size: 12.5px; }
      .addbtn .nm i { display: block; font-style: normal; color: var(--faint); font-size: 11px; }

      /* Already on this record: still listed, greyed, and genuinely not
         clickable — `disabled` rather than a class that only looks the part.
         Removing the row instead was the alternative and it makes the list
         shuffle under the cursor as you use it, which is worse than a row that
         has visibly done its job. */
      .addbtn:disabled { opacity: 0.45; cursor: default; }
      .addbtn:disabled:hover { background: #212328; border-color: var(--hair); }
      .addbtn .tick { color: var(--green); }
      .addbtn.mode .plus, .addbtn.mode .tick { color: var(--mode); }

      /* A repeatable provider that is already on the record. It keeps its `+`,
         because there is always another one to add, so the greyed-out treatment
         above would be a lie; the count beside the plus is what says it has
         been used, in place of the tick it cannot honestly wear. */
      .addbtn .count {
        font-size: 10.5px; font-weight: 700; color: var(--faint);
        border: 1px solid var(--line); border-radius: 20px; padding: 0 5px;
        margin-left: -4px; flex: 0 0 auto; align-self: center;
      }
      .addbtn.again .count { color: var(--accent); border-color: var(--accent-deep); }
      body.editing-mode .addbtn.again .count { color: var(--mode); border-color: var(--mode); }
      .addbtn .sw {
        width: 20px; height: 20px; border-radius: 6px; flex: 0 0 auto; align-self: center;
        display: flex; align-items: center; justify-content: center;
        font-size: 10px; font-weight: 700; line-height: 1;
      }

      /* The third column searches its own contents. Providers and modes are
         added the same way, so they are found the same way — one box over one
         list, rather than a box that only knows about half of what is below
         it. Outside the re-rendered body so typing never loses the caret. */
      .rail-search { padding: 12px 12px 8px; flex: 0 0 auto; }
      #rail.nosearch .rail-search { display: none; }

      /* ------------------------------------------------------- save status */
      .state { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
      .state .dot { width: 8px; height: 8px; }
      .state.saved .dot { background: var(--green); }
      .state.saving .dot { background: var(--accent); }
      .state.pending .dot { background: var(--amber); }
      .state.bad .dot { background: var(--red); }
      .state.bad { color: var(--red); }
      .savenote { color: var(--faint); font-size: 11px; margin-top: 5px; line-height: 1.4; }

      /* ------------------------------------------------------------ tiles */
      /* The key preview and the two controls that change it. Colour and avatar
         used to sit in an "Identity" form below; they do not describe the
         profile, they draw the picture — so they live with the picture. */
      .deck { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
      .tiles { display: flex; gap: 18px; align-items: flex-start; }
      .tiles figure { margin: 0; text-align: center; }
      .tiles img {
        width: 104px; height: 104px; border-radius: 12px; background: #101114;
        display: block; border: 1px solid var(--line);
      }
      .tiles figcaption { color: var(--faint); font-size: 11px; margin-top: 6px; }
      .look { flex: 1 1 260px; min-width: 240px; }
      .look .row { grid-template-columns: 70px minmax(0, 1fr); margin-bottom: 12px; }
      .avatar-preview {
        width: 38px; height: 38px; border-radius: 8px; object-fit: cover;
        border: 1px solid #3a3d44; background: #1b1d21; flex: 0 0 auto;
      }

      /* ------------------------------------- what this Mode's key will do
         Sits under the key preview, because it says what the pictures above it
         mean. Two states, and they are told apart by weight rather than by
         alarm: neither is a warning, neither is a problem, and one is not
         better than the other. A Mode with an on/off state gets the Mode accent
         on its edge — the same violet that says "this is a Mode" everywhere
         else — and a Mode without one is quiet and grey. Red and amber are
         deliberately not used: they are spoken for by `unset` and
         `unavailable`, and both mean something is wrong. Nothing is wrong here. */
      .statenote {
        margin: 16px 0 2px; padding: 10px 13px; border-radius: 8px;
        border: 1px solid var(--hair); border-left-width: 3px;
        background: #1e2025; color: var(--dim); font-size: 12.5px; line-height: 1.5;
      }
      .statenote b { display: block; color: var(--fg); font-weight: 600; margin-bottom: 3px; }
      .statenote.on {
        border-color: #55408a; border-left-color: var(--mode-deep);
        background: rgba(160, 119, 255, 0.07);
      }
      .statenote.on b { color: var(--mode); }

      /* ------------------------------------------------------------ modes */
      /* While a Mode is what is being edited, everything that is "this thing"
         carries the Mode accent: the selected row, the card edges, the plus on
         the add buttons. Nothing moves, nothing is renamed — only the colour
         changes, which is enough to make a mis-click on the wrong list obvious
         before it is made. */
      body.editing-mode #list li.sel { background: #302747; border-color: #55408a; }
      body.editing-mode .hw::before { background: var(--mode-deep); }
      body.editing-mode .addbtn .plus { color: var(--mode); }
      body.editing-mode .cfglink { color: var(--mode); }
      body.editing-mode .cfglink:hover { background: rgba(160, 119, 255, 0.14); }

      /* A Mode a profile activates, on the profile’s own screen. Same block as
         a provider because it was added the same way and is removed the same
         way; the violet edge is what says it is borrowed rather than owned. */
      .hw.moderef::before { background: var(--mode-deep); }
      .hw.moderef .swatch { width: 22px; height: 22px; border-radius: 6px; font-size: 11px; }
      .hw.moderef.dangling::before { background: var(--red); }
      /* A Mode that would set hardware the profile already sets itself. The
         runtime keeps the profile's, which is right and invisible — so say so. */
      .clash { color: var(--amber); font-size: 11.5px; display: block; margin-top: 2px; }
      /* Not a warning: a fact about how the reference behaves, on the Modes
         where it could be misread. Quiet, so it never competes with `.clash`
         sitting under it, which really is something to look at. */
      .aside { color: var(--faint); font-size: 11.5px; display: block; margin-top: 2px; }

      /* Profiles that reference the Mode on screen, so deleting it is never a
         guess about what else it would take with it. */
      .users { display: flex; flex-wrap: wrap; gap: 6px; }
      .userchip {
        display: flex; align-items: center; gap: 7px; background: #212328;
        border: 1px solid var(--hair); border-radius: 20px; padding: 3px 11px 3px 4px;
        font-size: 12px; color: var(--fg); cursor: pointer; font-family: inherit;
      }
      .userchip:hover { background: #2b2e35; border-color: #464a53; }
      .userchip .swatch { width: 20px; height: 20px; border-radius: 6px; font-size: 10px; }

      /* ----------------------------------------------------------- issues */
      #issues:empty { display: none; }
      .issues {
        background: #2a1f21; border: 1px solid #6b3b37; border-left-width: 3px;
        border-radius: 8px; padding: 10px 13px; margin-bottom: 16px;
      }
      .issues b { color: var(--red); font-size: 12.5px; display: block; margin-bottom: 4px; }
      .issues ul { margin: 0; padding-left: 18px; color: #e2b7b3; font-size: 12.5px; }

      /* ----------------------------------------------------------- footer */
      footer {
        flex: 0 0 auto; padding: 7px 16px; border-top: 1px solid var(--line);
        background: var(--panel); min-height: 34px; max-height: 26vh; overflow-y: auto;
        font-size: 12px;
      }
      /* Save errors arrive one per problem, and hiding all but the first would
         mean fixing them one reload at a time. */
      #msg { white-space: pre-line; }
      .err { color: var(--red); }
      .ok { color: var(--green); }

      /* Below this the third column moves under the pane rather than beside it.
         It used to do that with implicit rows and `overflow: visible`, which
         let the row grow to its content inside a fixed-height grid: the rail
         ran off the bottom of `main`, slid under the footer, and took its last
         control with it. Two explicit rows and a capped, scrolling rail keep it
         inside the area it was given — a column that scrolls is a column you
         can still reach the end of. */
      @media (max-width: 1140px) {
        main {
          grid-template-columns: 240px minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) auto;
        }
        #railLeft { grid-row: 1 / span 2; }
        #pane { grid-column: 2; grid-row: 1; min-height: 0; }
        #rail {
          grid-column: 2; grid-row: 2; border-left: none; border-top: 1px solid var(--line);
          max-height: 40vh; min-height: 0;
        }
        .rail-search { padding: 10px 12px 6px; }
        #railBody {
          display: flex; flex-wrap: wrap; align-items: flex-start;
          gap: 0 16px; padding-bottom: 12px;
        }
        #railBody > .rail-group { flex: 1 1 240px; margin-top: 0; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Rig Profiles</h1>
      <span class="spacer"></span>
      <span class="dot" id="dot"></span>
      <span class="conn" id="conn">connecting…</span>
    </header>

    <main>
      <!-- Nothing restores on its own any more, so this is the prompt. Hidden
           until getBackupOffer says the store holds less than a backup does. -->
      <div id="offerBar" class="offerbar" hidden></div>
      <aside id="railLeft">
        <div class="rail-head">
          <span class="rail-title" id="railTitle">Profiles</span>
        </div>
        <div class="seg" id="seg">
          <button data-kind="profiles" class="on">Profiles</button>
          <button data-kind="modes">Modes</button>
        </div>
        <div class="segnote" id="segnote"></div>
        <div class="pad">
          <input type="search" id="search" placeholder="Search profiles" autocomplete="off" />
        </div>
        <ol id="list"></ol>
        <nav>
          <button id="navSettings" class="navbtn"><span class="ico">⚙</span> Settings</button>
        </nav>
      </aside>

      <section id="pane"></section>

      <aside id="rail">
        <!-- Outside #railBody on purpose: the body is re-rendered whenever the
             draft changes, and a search box that is re-created as you type into
             it loses both its value and the caret. -->
        <div class="rail-search">
          <input type="search" id="railSearch" placeholder="Search" autocomplete="off" />
        </div>
        <div id="railBody"></div>
      </aside>
    </main>

    <footer><span id="msg" class="muted"></span></footer>

    <!-- A module, so the list operations can be imported from editorState.js
         and tested in Node without a browser. -->
    <script type="module">
      // The browser-hosted profile editor. Plain DOM and one fetch wrapper: the
      // plugin has no build step, and the page is served from the plugin itself
      // with a CSP that blocks anything external, so a framework could not be
      // loaded from a CDN even if one were wanted.
      //
      // Every request here is a request the property inspector also makes —
      // handlePiRequest on the other end is the same module. This page never
      // writes global settings itself; it asks for the same saveProfiles path,
      // so validation cannot be skipped by editing the page.

      // The token stays in the address bar so a reload still authenticates.
      const token = new URLSearchParams(location.search).get('t') ?? '';
      const q = `?t=${encodeURIComponent(token)}`;

      // Dynamic rather than plain imports so the token travels with them: every
      // route on this server takes the same key, with no exception to remember.
      const {
        addProfile, addMode, removeProfile, moveProfile, keepSelection,
        matchesSearch, slugify, withIds, fieldValue, optionLabel, holdForNaming,
        referencesMode, setModeRef, profilesUsingMode, detachMode, modeOverlap,
        modeStatefulness,
        offers, unknownSelectValue, unknownValues, blocksEditing,
        isBlank, blankBlocks, forStorage,
        providerIdOf, instanceKeys, nextInstanceKey, isRepeatable, blockSummary,
      } = await import(`./editorState.js${q}`);
      // Same module the key renderer uses, so "readable" means one thing here
      // and on the deck.
      const { readableTextColor } = await import(`./contrast.js${q}`);

      // Two lists, one editor.
      //
      // Profiles and Modes are the same shape and answer different questions: a
      // profile is a claim about who is at the rig — exclusive, persistent,
      // gated when it is dangerous — and a Mode is something the rig is doing,
      // which must never be able to say a different human sat down. They are
      // edited side by side because they are configured the same way, and they
      // are never on screen at the same time because they must never be
      // confused for one another.
      //
      // Some Modes carry an on/off state and some do not, and that is NOT a
      // third list. It is derived from the providers a Mode holds — see
      // `modeStatefulness` — so there is nothing here to keep in step with it.
      let profiles = [];      // the draft being edited
      let modes = [];         // the Mode draft, saved in the same request
      // [{id,label,verifiable,contexts,reportsState,fields}] from the plugin
      let providers = [];
      let hardware = {};      // global settings draft (never holds the Govee key)
      // What is being edited, held by reference rather than by id — see
      // editorState.js for why an id is the wrong handle here. One selection per
      // list, so flipping to Modes and back lands on the profile you left.
      let selectedProfile = null;
      let selectedMode = null;
      let kind = 'profiles';  // which list the sidebar shows: 'profiles' | 'modes'
      let view = 'editor';    // 'editor' | 'settings'
      let previewTimer = null;

      /** The list the sidebar is showing. */
      const listOf = () => (kind === 'modes' ? modes : profiles);
      /** Is a Mode the thing being edited right now? */
      const editingMode = () => kind === 'modes' && view === 'editor';

      // A record's providers map is keyed by CONFIG KEY, and a repeatable
      // provider's second and later blocks carry a suffix — `state-flag#2`. The
      // two lookups below are the only way this page turns one of those keys
      // into a provider, so a suffix costs the rest of the file nothing. Every
      // `data-hw`, `data-fld` and `data-rmprov` in here is a KEY; `prov.id` is
      // an id, and the two are equal for everything that is not repeatable,
      // which is precisely why they must not be used interchangeably.

      /** The provider descriptor a config key names, or undefined. */
      const provOf = (key) => providers.find((prov) => prov.id === providerIdOf(key));
      /** What to call the block stored under this key, for a human. */
      const keyLabel = (key) => provOf(key)?.label ?? providerIdOf(key);

      /**
       * What the two lists are, in one line each, shown under the selector.
       *
       * The Modes line has to cover two behaviours without promising either.
       * "Fires and forgets" was true when this was one concept and is now true
       * of only some Modes: one holding a provider that can report itself gets
       * a key with an on/off state, one holding none behaves exactly as before.
       * So the line says both are possible and does not pretend the user can
       * choose — they cannot, it follows from what they put in it, and the pane
       * says which they have got. What survives unqualified is the part that
       * matters most and is true of every Mode: it never touches who is at the
       * rig. That is the whole reason these are not profiles.
       */
      const KIND_NOTE = {
        profiles:
          'Who is at the rig. One at a time — pressing one turns the others off — ' +
          'and it is remembered until something else is pressed.',
        modes:
          'Something the rig is doing, not who is at it: lights, VR, a playlist, a ' +
          'script. Some can report that they are on, and their key shows it; the rest ' +
          'simply run. Neither kind changes who the rig thinks is at it.',
      };

      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      /** `"mode:sun:set"` -> `["mode", "sun:set"]`. Ids own everything after
       *  the first colon, so a colon in one cannot lose part of it. */
      const splitOnce = (s, sep = ':') => {
        const at = String(s).indexOf(sep);
        return at < 0 ? [String(s), ''] : [String(s).slice(0, at), String(s).slice(at + 1)];
      };

      /**
       * Global settings each provider depends on, so a provider card can point
       * at them. Discovering that the Govee key lived behind an unrelated menu
       * item took a search; a link from the thing that needs it does not.
       */
      const PROVIDER_SETTINGS = {
        'fanatec-base': 'Fanatec wheelbase',
        govee: 'Govee lighting',
        moza: 'MOZA pedal',
      };

      /**
       * Ask the plugin something. Same request names as the inspector's `ask`,
       * and the same promise: it always settles, because a request that never
       * answers is indistinguishable from a save that quietly did nothing.
       */
      async function ask(request, extra = {}) {
        try {
          const res = await fetch('/api', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-rig-editor': token },
            body: JSON.stringify({ request, ...extra }),
          });
          if (!res.ok) return { request, ok: false, error: `${res.status} ${res.statusText}` };
          return await res.json();
        } catch (err) {
          return { request, ok: false, error: err.message };
        }
      }

      function say(text, kind = 'muted') {
        const el = $('msg');
        el.className = kind;
        el.textContent = text;
      }

      // =====================================================================
      // Backup and restore
      //
      // Two artifacts, deliberately. The YAML is a config document — readable,
      // editable, committable, and unable to carry avatars. The backup is a
      // snapshot: one file, everything, restorable. Neither carries a
      // credential, because credentials do not live in the settings blob these
      // are built from. See docs/specs/backup-and-restore.md.
      // =====================================================================

      /** How a person reads a timestamp, not how a machine writes one. */
      function whenText(iso) {
        if (!iso) return 'unknown';
        const then = new Date(iso);
        if (Number.isNaN(then.getTime())) return 'unknown';
        const mins = Math.round((Date.now() - then) / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return `${mins} minute${mins === 1 ? '' : 's'} ago`;
        if (mins < 60 * 24) {
          const h = Math.round(mins / 60);
          return `${h} hour${h === 1 ? '' : 's'} ago`;
        }
        return then.toLocaleString(undefined, {
          day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit',
        });
      }

      const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

      /**
       * Hand the browser a file.
       *
       * The editor is a real tab on 127.0.0.1, so this needs no plugin round
       * trip beyond fetching the content — a Blob and an object URL is the
       * whole mechanism.
       */
      function download(filename, text, type) {
        const url = URL.createObjectURL(new Blob([text], { type }));
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      async function refreshBackupStatus() {
        const el = $('backupStatus');
        if (!el) return;
        const r = await ask('getBackupStatus');
        if (!r?.ok) { el.textContent = 'Backup status unavailable.'; return; }
        const last = r.lastSavedAt ? `Last saved ${whenText(r.lastSavedAt)}` : 'No backup yet';
        el.innerHTML = `${last} · ${plural(r.generationCount, 'earlier version')} kept<br />`
          + `<code>${esc(r.dir)}</code>`;
      }

      async function refreshHistory() {
        const el = $('historyList');
        if (!el) return;
        const r = await ask('listBackups');
        if (!r?.ok) { el.textContent = 'Could not read the history.'; return; }
        if (!r.backups.length) {
          el.textContent = 'No earlier versions yet. One is saved when your changes settle.';
          return;
        }
        el.innerHTML = r.backups.map((b) => `
          <div class="histrow">
            <div>
              <strong>${esc(whenText(b.savedAt))}</strong>
              <div class="help">${plural(b.profiles, 'profile')}, ${plural(b.modes, 'Mode')}${
                b.reason ? ` · ${esc(b.reason)}` : ''}</div>
            </div>
            <button class="ghost" data-restore-id="${esc(b.id)}">Restore</button>
          </div>`).join('');
      }

      let pendingRestore = null;
      let dismissedOffer = false;
      let offered = null;

      /**
       * Preview, then confirm. Always both.
       *
       * A restore replaces configuration, so it is never one click. The preview
       * says what is in the file and what it will not bring back; confirming is
       * a separate, deliberate act.
       */
      async function previewFile(text) {
        const box = $('restorePreview');
        if (!box) return;
        const r = await ask('previewRestore', { content: text });
        if (!r?.ok) {
          box.innerHTML = `<div class="warn">${esc(r?.error ?? 'That file could not be read.')}</div>`;
          return;
        }
        pendingRestore = text;
        const sm = r.summary;
        const bits = [plural(sm.profiles, 'profile'), plural(sm.modes, 'Mode')];
        if (sm.avatars) bits.push(plural(sm.avatars, 'avatar'));
        const notes = [];
        if (sm.partial) {
          notes.push('This is a config export, not a full backup: it has no avatars. Existing ones are left alone.');
        }
        if (sm.unknownProviders?.length) {
          // Config for hardware nothing here answers to. It restores and does
          // nothing, which is worse than refusing — so say it, plainly.
          notes.push(`Warning: ${sm.unknownProviders.map(esc).join(', ')} ` +
            `${sm.unknownProviders.length === 1 ? 'is not a provider' : 'are not providers'} on this machine. ` +
            'That configuration will be kept but will do nothing.');
        }
        if (sm.secretsToReenter?.length) {
          notes.push(`You will need to re-enter: ${sm.secretsToReenter.map(esc).join(', ')}.`);
        }
        box.innerHTML = `
          <div class="preview">
            <strong>${sm.savedAt ? `Backup from ${esc(whenText(sm.savedAt))}` : 'Config export'}</strong>
            <div class="help">${bits.join(', ')}</div>
            ${notes.map((n) => `<div class="help">${n}</div>`).join('')}
            <div class="actions">
              <button id="restoreConfirm">Replace my configuration</button>
              <button id="restoreCancel" class="ghost">Cancel</button>
            </div>
          </div>`;
      }

      async function doRestore(payload, label) {
        const r = await ask('restoreBackup', payload);
        if (!r?.ok) { say(r?.error ?? 'Restore failed.', 'err'); return; }
        pendingRestore = null;
        dismissedOffer = true;
        const extra = r.secretsToReenter?.length
          ? ` Re-enter ${r.secretsToReenter.join(', ')} above.` : '';
        say(`Restored ${plural(r.profiles, 'profile')} and ${plural(r.modes, 'Mode')} from ${label}.${extra}`, 'ok');
        const box = $('restorePreview');
        if (box) box.innerHTML = '';
        const bar = $('offerBar');
        if (bar) bar.hidden = true;
        // loadProfiles only refills the model. The list, the pane and the rail
        // are drawn by render(), and without it a restore that plainly worked
        // still says "No profiles yet" — which reads as the restore failing.
        await loadProfiles();
        setKind(kind);
        render();
        await refreshBackupStatus();
        await refreshHistory();
      }

      /**
       * The offer, shown when the store holds less than the newest backup does.
       *
       * Nothing restores on its own any more. If Stream Deck loses its settings
       * the deck shows broken keys, and this is what greets whoever opens the
       * editor to find out why.
       */
      async function checkBackupOffer() {
        if (dismissedOffer) return;
        const bar = $('offerBar');
        if (!bar) return;
        const r = await ask('getBackupOffer');
        offered = r?.newest ?? null;
        if (!r?.ok || !r.degraded) { bar.hidden = true; return; }
        bar.hidden = false;
        bar.innerHTML = `
          <div>
            <strong>This looks like it lost data.</strong>
            The newest backup is from <strong>${esc(whenText(r.newest.savedAt))}</strong> and has
            ${plural(r.newest.profiles, 'profile')} and ${plural(r.newest.modes, 'Mode')};
            you currently have ${r.have ? plural(r.have, 'profile') : '<strong>none</strong>'}.
          </div>
          <div class="actions">
            <button id="offerRestore">Restore it</button>
            <button id="offerDismiss" class="ghost">Dismiss</button>
          </div>`;
      }

      /** The record on screen — a profile or a Mode, depending on the tab. */
      const current = () => {
        const sel = kind === 'modes' ? selectedMode : selectedProfile;
        return listOf().includes(sel) ? sel : null;
      };

      /** Set the selection for whichever list is showing. */
      function select(record) {
        if (kind === 'modes') selectedMode = record;
        else selectedProfile = record;
      }

      // =====================================================================
      // Saving
      // =====================================================================
      //
      // One save, and it is automatic. There used to be two buttons — profiles
      // and settings — which asked the user to know which half of the screen a
      // change belonged to. That is the plugin's bookkeeping, not theirs.
      //
      // Autosave is safe here because the rules that make it dangerous
      // elsewhere do not apply. There is no partial write: saveProfiles
      // validates the whole list server-side and refuses it entire, so a
      // rejected save leaves the stored profiles exactly as they were and the
      // draft still dirty in the page. Nothing here is a transaction with the
      // outside world either — a saved profile does not touch the wheelbase,
      // it just sits in settings until a key is pressed.
      //
      // Two things it does have to respect:
      //
      //   * ids are slugged from the name the first time a profile is saved,
      //     and are permanent afterwards. Saving mid-word would freeze "Ka" as
      //     the id of "Kai" forever, so the first save of an unsaved profile
      //     waits for the name field to be left.
      //   * a half-typed API key must never overwrite a good one, so that one
      //     field commits on blur rather than on every keystroke.

      const AUTOSAVE_MS = 700;
      // Profiles and modes are one draft with one dirty flag, because they are
      // saved in one request: a profile references modes by id, so storing the
      // two halves separately would open a window where a saved profile names a
      // Mode that is not stored yet.
      let dirtyDraft = false;
      let dirtySettings = false;
      let saveTimer = null;
      let saving = false;
      let saveAgain = false;
      let saveErrors = [];
      // record object -> its problems. Keyed by object rather than by id
      // because an unsaved record has no id, and those are exactly the ones
      // most likely to be rejected.
      let broken = new Map();
      let savedOnce = false;

      // =====================================================================
      // Blocks that hold nothing yet
      // =====================================================================
      //
      // A provider block is created empty — adding MOZA to a profile means
      // `providers.moza = {}` and nothing else. Every provider refuses that,
      // rightly, so with autosave running the act of adding one used to be the
      // act of being told off for a state the user had had no chance to leave.
      //
      // Three states, and the third is the new one:
      //
      //   unavailable  a stored value its provider can no longer find. Amber,
      //                the block is locked, the value is kept. (Unchanged.)
      //   unchecked    a value that could not be verified because no options
      //                came back. Quiet, nothing locked. (Unchanged.)
      //   blank        nothing has been chosen here yet. Not an error, because
      //                the user has not finished; not saved either, because
      //                incomplete configuration is not configuration.
      //
      // `blank` is calm exactly until the user is done with it, and then it is
      // not. Two things end the grace:
      //
      //   * a decision — a `change` event on one of its fields that leaves it
      //     still empty. Choosing "— none —" is a choice, and gets an answer.
      //     `input` deliberately does not count: clearing a textarea to retype
      //     is mid-thought, not a decision;
      //   * walking away — selecting another record, switching lists, opening
      //     Settings. Leaving it blank IS leaving it blank.
      //
      // Once raised, the block says it was not saved, in red, and keeps saying
      // it until it is filled in or removed.

      // record object -> the provider ids on it whose blank block has stopped
      // being new. Keyed by object for the same reason `broken` is: a record
      // that has never been saved has no id to key by. Weak because it is only
      // ever read by key — a deleted record must not be held alive by a note
      // about a block it no longer has.
      let raisedBlanks = new WeakMap();

      const isRaised = (record, providerId) =>
        raisedBlanks.get(record)?.has(providerId) ?? false;

      /** Blank blocks on this record that have been left blank. */
      const raisedOn = (record) => blankBlocks(record).filter((id) => isRaised(record, id));

      function setRaised(record, providerId, on) {
        if (!record) return;
        const ids = raisedBlanks.get(record) ?? new Set();
        if (on) ids.add(providerId);
        else ids.delete(providerId);
        if (ids.size) raisedBlanks.set(record, ids);
        else raisedBlanks.delete(record);
      }

      /**
       * About to show something else. Anything still blank on the record being
       * left has now been left that way, so it stops being new.
       *
       * Called before the selection moves rather than after, because it needs
       * the record the user is leaving, not the one they are arriving at.
       */
      function leaveRecord() {
        // Nothing is being left if nothing was on screen — the Settings pane
        // shows no record, so coming back out of it is arriving, not leaving.
        if (view !== 'editor') return;
        const p = current();
        if (!p) return;
        const fresh = blankBlocks(p).filter((key) => !isRaised(p, key));
        if (!fresh.length) return;
        for (const key of fresh) setRaised(p, key, true);
        // Named by provider and deduplicated — two empty flag blocks are two
        // blocks with one name — so the grammar follows the names rather than
        // the blocks.
        const names = [...new Set(fresh.map(keyLabel))];
        const one = names.length === 1;
        say(
          `${names.join(', ')} on “${p.name || '(unnamed)'}” ${one ? 'has' : 'have'} ` +
            `nothing chosen, so ${one ? 'it was' : 'they were'} not saved. ` +
            `Open the ${editingMode() ? 'Mode' : 'profile'} again to finish or remove ${
              one ? 'it' : 'them'}.`,
          'err',
        );
      }

      /** Mark a draft changed and schedule the save. */
      function touch(what, { now = false, defer = false } = {}) {
        if (what === 'settings') dirtySettings = true;
        else dirtyDraft = true;
        saveErrors = [];
        broken = new Map();
        renderSaveState();
        renderIssues();
        clearTimeout(saveTimer);
        if (defer) return;                       // dirty, but not on a timer yet
        saveTimer = setTimeout(commit, now ? 0 : AUTOSAVE_MS);
      }

      const isDirty = () => dirtyDraft || dirtySettings;

      /**
       * Is the caret currently in a not-yet-saved record's name field?
       *
       * Both lists, because both slug a permanent id out of the name on their
       * first save — a Mode called “Kai’s lights” would freeze as `ka` just as
       * readily as a profile would.
       */
      function namingInProgress() {
        return holdForNaming([...profiles, ...modes], document.activeElement?.dataset?.f);
      }

      async function commit() {
        clearTimeout(saveTimer);
        saveTimer = null;

        // Overlapping saves would race over which reply is authoritative.
        if (saving) { saveAgain = true; return; }
        if (!isDirty()) return;

        // Hold, do not drop: the change stays dirty and saves the moment the
        // name is finished.
        if (namingInProgress()) {
          saveTimer = setTimeout(commit, AUTOSAVE_MS);
          renderSaveState();
          return;
        }

        saving = true;
        renderSaveState();
        const problems = [];

        if (dirtySettings) {
          const reply = await ask('saveSettings', {
            settings: {
              goveeApiKey: hardware.goveeApiKey ?? '',
              goveeDevices: hardware.goveeDevices?.length ? hardware.goveeDevices : null,
              // Always a literal boolean. The providers read these as
              // `settings?.x !== false`, so "missing" means enabled — writing
              // undefined for an unticked box would turn it straight back on
              // at the next switch, and the user would never see why.
              fanatecAutoStart: hardware.fanatecAutoStart !== false,
              mozaClosePitHouse: hardware.mozaClosePitHouse !== false,
              // The odd one out, and deliberately: reopening Pit House
              // re-applies its own preset over the one just written, so this
              // stays off until it is asked for.
              mozaReopenPitHouse: hardware.mozaReopenPitHouse === true,
            },
          });
          if (reply.ok === false) {
            problems.push(reply.error ?? 'settings could not be saved');
          } else {
            dirtySettings = false;
            hardware.goveeApiKeySet = reply.goveeApiKeySet;
            // Never keep the typed key around after it has been stored.
            delete hardware.goveeApiKey;
            // Cleared and relabelled in place rather than by re-rendering the
            // pane, which would throw away anything else being typed. The
            // placeholder follows the reply, not the fact that a save happened:
            // saving the MOZA checkbox must not claim a key is stored.
            const field = $('goveeKey');
            if (field) {
              field.value = '';
              field.placeholder = reply.goveeApiKeySet ? '•••••••• (saved)' : 'not set';
            }
          }
        }

        const nextBroken = new Map();

        if (dirtyDraft) {
          // Modes first: a profile may reference one by id, and an id only
          // exists once its record has been slugged.
          withIds(modes, 'mode');
          withIds(profiles);
          // avatarDataUri is a render-time convenience; never persist the bytes.
          // Global settings are deliberately not sent here: saveProfiles merges
          // what it is given over the stored blob, and this page is never told
          // the Govee key, so sending "the settings" back would erase it.
          //
          // forStorage leaves out provider blocks that hold nothing at all. It
          // is the draft that keeps them, not the store: a block with no
          // setting in it configures nothing, and every provider says so when
          // asked. Sending it would have the server refuse the whole list —
          // both profiles AND modes, since they save together — so a provider
          // half-added to one profile would block an unrelated rename on
          // another. The server's rules are untouched; it is simply not handed
          // a block that says nothing. See editorState.js for the full case.
          const payload = forStorage(profiles).map(({ avatarDataUri, ...rest }) => rest);
          const reply = await ask('saveProfiles', { profiles: payload, modes: forStorage(modes) });
          if (!reply.ok) {
            // Every problem, not just the first: they are named per record, and
            // showing one at a time means a fix per round-trip. Mode problems
            // are labelled, because "Sunset: needs a name" is otherwise a
            // profile as far as the reader is concerned.
            const mine = reply.errors ?? [];
            const theirs = reply.modeErrors ?? [];
            if (!mine.length && !theirs.length) problems.push(reply.error ?? 'save failed');
            problems.push(...mine, ...theirs.map((m) => `Mode ${m}`));
            attribute(mine, profiles, nextBroken);
            attribute(theirs, modes, nextBroken);
          } else {
            dirtyDraft = false;
            savedOnce = true;
          }
        }

        saving = false;
        saveErrors = problems;
        broken = nextBroken;

        if (problems.length) say(problems.join('\n'), 'err');
        else if ($('msg').className === 'err') say('');

        renderSaveState();
        renderIssues();
        renderList();
        renderRail();     // the id appears once a profile has been saved

        if (saveAgain) { saveAgain = false; commit(); }
      }

      /** The status shown beside the name, in the one place it lives. */
      function saveStatus() {
        if (saveErrors.length) {
          return {
            cls: 'bad',
            text: `Not saved — ${saveErrors.length} problem${saveErrors.length === 1 ? '' : 's'}`,
            note: 'Your edits are still here. Fix the problems below and they save themselves.',
            retry: true,
          };
        }
        if (saving) return { cls: 'saving', text: 'Saving…', note: '' };
        if (isDirty()) {
          return {
            cls: 'pending',
            text: 'Unsaved changes',
            note: namingInProgress()
              ? `Saving as soon as you finish naming this ${editingMode() ? 'Mode' : 'profile'}.`
              : 'Saving automatically…',
          };
        }
        // Everything that could be saved has been — but a block holding nothing
        // was left out of it, so "all changes saved" would be a small lie told
        // in green. This is the calm state made visible: neutral wording, no
        // failure, and an accurate count of what is not in the store yet.
        const waiting = [...profiles, ...modes].reduce((n, r) => n + blankBlocks(r).length, 0);
        if (waiting) {
          return {
            cls: 'holding',
            text: `Saved — ${waiting} block${waiting === 1 ? '' : 's'} not set up`,
            note: `A block with nothing chosen in it is not stored, so nothing is broken by
                   it. Give ${waiting === 1 ? 'it' : 'them'} a setting and ${
                     waiting === 1 ? 'it saves itself' : 'they save themselves'}.`,
          };
        }

        return {
          cls: 'saved',
          text: 'All changes saved',
          note: savedOnce ? '' : 'Changes save themselves as you make them.',
        };
      }

      function renderSaveState() {
        const host = $('saveState');
        if (!host) return;
        const s = saveStatus();
        host.innerHTML =
          `<div class="state ${s.cls}"><span class="dot"></span><span>${esc(s.text)}</span></div>` +
          (s.note ? `<div class="savenote">${esc(s.note)}</div>` : '') +
          (s.retry ? '<button id="saveNow">Try saving again</button>' : '');
      }

      /**
       * Split save errors back out to the records they name.
       *
       * The server prefixes each message with the record's name or id, so this
       * is the inverse. Done against one list at a time: a profile and a Mode
       * are allowed to share a name, and attributing "Sunset: needs a name" to
       * whichever list happened to be searched first would put the error on the
       * wrong screen.
       */
      function attribute(messages, records, into) {
        for (const message of messages) {
          const at = message.indexOf(': ');
          const where = at > 0 ? message.slice(0, at) : '';
          const owner = records.find((r) => (r.name || r.id) === where || r.id === where);
          if (!owner) continue;
          into.set(owner, [...(into.get(owner) ?? []), message.slice(at + 2)]);
        }
      }

      /** Problems with the record on screen, shown above it rather than only
       *  in the footer — an error about a field you cannot see is a puzzle. */
      function renderIssues() {
        const host = $('issues');
        if (!host) return;
        const p = current();
        const noun = editingMode() ? 'Mode' : 'profile';
        const mine = broken.get(p) ?? [];

        // Blocks left blank are a different kind of news and must not borrow
        // the wording above: this record HAS been saved, and saved correctly —
        // what it was saved without is the point. Said separately, and only
        // once the grace has been used up.
        // Deduplicated: two unfinished flag blocks are two blocks and one name,
        // and "Saved without Rig State Flag, Rig State Flag" is not a sentence.
        const unset = [...new Set(raisedOn(p).map(keyLabel))];

        host.innerHTML =
          (mine.length
            ? `<div class="issues"><b>This ${noun} cannot be saved yet</b><ul>${
                mine.map((m) => `<li>${esc(m)}</li>`).join('')}</ul></div>`
            : '') +
          (unset.length
            ? `<div class="issues unset"><b>Saved without ${esc(unset.join(', '))}</b>
                 <p>Nothing is chosen ${unset.length === 1 ? 'on it' : 'on them'}, so
                 ${unset.length === 1 ? 'it is' : 'they are'} not stored and
                 ${unset.length === 1 ? 'does' : 'do'} nothing when this ${noun}'s key is
                 pressed. Fill ${unset.length === 1 ? 'it' : 'them'} in below, or remove the
                 block with ✕.</p></div>`
            : '');
      }

      // =====================================================================
      // Sidebar
      // =====================================================================

      function renderList() {
        const host = $('list');
        const all = listOf();
        const matches = all.filter((p) => matchesSearch(p, $('search').value));
        const isMode = kind === 'modes';

        host.innerHTML = matches.map((p) => {
          const names = providerLabels(p);
          // A profile's subtitle lists its hardware; a Mode’s says how many
          // profiles lean on it, because that is the number that decides
          // whether deleting it is safe.
          const used = isMode ? profilesUsingMode(profiles, p.id).length : 0;
          if (isMode && used) names.push(`used by ${used} profile${used === 1 ? '' : 's'}`);
          else if (!isMode && p.modes?.length) names.push(`+${p.modes.length} mode${p.modes.length === 1 ? '' : 's'}`);
          // The initial is drawn in whichever ink actually reads on the chosen
          // colour — see contrast.js. A pale profile colour used to get white
          // text on white.
          const face = p.avatarDataUri
            ? `background-image:url(${p.avatarDataUri})`
            : `background:${esc(p.color)};color:${readableTextColor(p.color)}`;
          // Rows carry their index in the full list, not their id: search
          // filters the rows, and an unsaved profile has no id to carry.
          //
          // A row is only "selected" while this list is what the pane is
          // showing. On the settings screen nothing in this list is being
          // edited, so nothing in it is highlighted.
          const isSel = p === current() && view === 'editor';
          return `<li draggable="true" data-i="${all.indexOf(p)}" class="${isSel ? 'sel' : ''}">
            <span class="grip">⠿</span>
            <span class="swatch${p.avatarDataUri ? ' photo' : ''}" style="${face}"
              >${esc((p.name || '?').trim().charAt(0).toUpperCase())}</span>
            <span class="who">
              <b>${esc(p.name || '(unnamed)')}</b>
              <span>${esc(names.length ? names.join(', ') : 'nothing configured')}</span>
            </span>
            ${broken.has(p) ? '<span class="bad" title="Cannot be saved yet">!</span>' : ''}
            ${!broken.has(p) && raisedOn(p).length
              ? '<span class="warn" title="Something on it was left with nothing chosen, and was not saved">!</span>'
              : ''}
          </li>`;
        }).join('');

        if (!matches.length) {
          host.innerHTML = `<li class="empty">${
            all.length
              ? 'Nothing matches that search.'
              : isMode
                ? 'No Modes yet. A Mode is lights, VR, a playlist, a script — something the rig does.'
                : 'No profiles yet.'}</li>`;
        }

        // The next row, not a fixture at the bottom of the rail: a filtered
        // list brings it up under the last match, where the eye already is.
        host.innerHTML += `<li class="newrow"><button data-new
          title="Create a new ${isMode ? 'Mode' : 'profile'}"><b>+</b> New ${
          isMode ? 'Mode' : 'profile'}</button></li>`;
      }

      /** Point the sidebar at one list or the other. */
      function setKind(next) {
        leaveRecord();
        kind = next;
        view = 'editor';
        $('railTitle').textContent = next === 'modes' ? 'Modes' : 'Profiles';
        $('segnote').textContent = KIND_NOTE[next];
        $('search').placeholder = next === 'modes' ? 'Search modes' : 'Search profiles';
        $('railSearch').placeholder = next === 'modes' ? 'Search hardware & apps' : 'Search hardware, apps, modes';
        for (const b of $('seg').children) b.classList.toggle('on', b.dataset.kind === next);
        render();
      }

      // =====================================================================
      // Fields
      // =====================================================================

      /**
       * Render one schema-declared field. Identical vocabulary to the inspector.
       *
       * `key` is the CONFIG KEY of the block this field belongs to, which is
       * the provider id for all but a repeatable provider's extra instances.
       * Every control carries it so an edit lands in the block it was made in:
       * with two flag blocks on screen, `state-flag|flag` would name both, and
       * whichever the query picked first would take every keystroke from both.
       */
      function fieldHtml(prov, field, cfg, { locked = false, key = prov.id } = {}) {
        const v = cfg?.[field.key];
        const id = `${key}|${field.key}`;
        const help = field.help ? `<div class="help">${esc(field.help)}</div>` : '';
        // Locked fields keep their values on screen and refuse to take new
        // ones. `disabled` rather than a class that only looks the part.
        const off = locked ? ' disabled' : '';

        if (field.type === 'select') {
          const unknown = unknownSelectValue(field, v);
          // A value the options cannot explain is shown AS ITSELF, never as a
          // dropdown. A <select> can only display an option it has, so an
          // unmatched uuid renders as "— none —" — and one change event on that
          // select would write the blank back over the uuid and lose the only
          // identifying information left. There is no control here to fire it.
          if (unknown) return `<div class="row"><label>${esc(field.label)}</label>
            <div class="grp"><code class="lostval" title="the value stored on this profile"
              >${esc(unknown.value)}</code></div>
            <div class="help lost">${unknown.why === 'missing'
              ? `Not in ${esc(prov.label)}'s list any more — it was probably renamed or
                 deleted in the app that owns it. The value is kept exactly as it is, so
                 nothing is repointed behind your back. Remove this block with ✕ if it is
                 no longer wanted.`
              : `${esc(prov.label)} did not offer any options just now, so this cannot be
                 checked — it may be perfectly fine. The value is kept as it is. Reconnect
                 the hardware, or open the app that owns it, and reopen this editor.`}</div>
          </div>`;

          const opts = (field.options ?? []).map((o) =>
            // optionLabel presents a wheelbase slot the way the Fanatec app
            // names it; everything else passes through untouched.
            `<option value="${esc(o.value)}"${String(v) === String(o.value) ? ' selected' : ''}
              >${esc(optionLabel(o.label))}</option>`).join('');
          return `<div class="row"><label>${esc(field.label)}</label>
            <select data-fld="${id}"${off}><option value="">— none —</option>${opts}</select>${help}</div>`;
        }
        if (field.type === 'range') {
          // A slider always has a position, so it cannot express "leave this
          // setting alone". The checkbox carries that: unticked removes the key
          // from the profile entirely, which is what stops a blank field being
          // written to the pedal as a zero.
          const on = v !== undefined && v !== null && String(v) !== '';
          const shown = on ? v : field.min;
          return `<div class="row"><label>${esc(field.label)}</label>
            <div class="grp">
              <input type="checkbox" data-fldon="${id}"${on ? ' checked' : ''}${off}
                     title="Set this on this profile" />
              <input type="range" data-fld="${id}" min="${field.min}" max="${field.max}"
                     step="${field.step ?? 1}" value="${esc(shown)}"${on && !locked ? '' : ' disabled'} />
              <span class="rv${on ? '' : ' off'}" data-rv="${id}" data-unit="${esc(field.unit ?? '')}"
                >${on ? esc(v) + (field.unit ?? '') : 'not set'}</span>
            </div>${help}</div>`;
        }
        if (field.type === 'boolean') {
          return `<div class="row"><label>${esc(field.label)}</label>
            <div class="grp"><input type="checkbox" data-fld="${id}"${v ? ' checked' : ''}${off} />
            <span class="muted">${esc(field.help ?? '')}</span></div></div>`;
        }
        if (field.type === 'textarea') {
          return `<div class="row" style="align-items:flex-start"><label>${esc(field.label)}</label>
            <textarea class="cmds" data-fld="${id}" spellcheck="false"${off}
              placeholder="${esc(field.placeholder ?? '')}">${esc(v ?? '')}</textarea>${help}</div>`;
        }
        return `<div class="row"><label>${esc(field.label)}</label>
          <input type="text" data-fld="${id}" value="${esc(v ?? '')}"${off} />${help}</div>`;
      }

      /**
       * The head badge for a block that holds nothing.
       *
       * Its own colour, not amber and not red until it earns red: `unavailable`
       * is already amber and means a value that is gone, and reusing that here
       * would say something untrue about a block that has never held a value.
       */
      const blankBadgeHtml = (blank, raised) =>
        !blank
          ? ''
          : `<span class="badge ${raised ? 'unset' : 'todo'}" title="${raised
              ? 'Nothing is chosen here, so this block was not saved'
              : 'Not stored until something is chosen'}">${
              raised ? 'not set up' : 'needs setting up'}</span>`;

      /** The line inside a blank block: an invitation, or an answer. */
      const blankNoteHtml = (prov, blank, raised) => {
        if (!blank) return '';
        const noun = editingMode() ? 'Mode' : 'profile';
        return raised
          ? `<div class="unsetbanner"><b>Not saved</b> Nothing is chosen here, so this
               ${noun} was stored without ${esc(prov.label)} and its key will not touch it.
               Choose something below, or remove the block with ✕.</div>`
          : `<div class="newbanner">Nothing chosen yet. A block with no setting in it is not
               stored — pick one below and it saves itself.</div>`;
      };

      /**
       * Repaint one block's blank/unset chrome in place.
       *
       * In place rather than by re-rendering the pane, for the same reason the
       * hold toggle is: a field edit that redrew everything would take the caret
       * out of the select or textarea that caused it. Only the classes, the
       * badge and the note move; the fields themselves are already correct,
       * because the user is the one who just changed them.
       */
      /**
       * Repaint one block's subtitle in place, on every keystroke.
       *
       * Separate from `paintBlock` because it runs on a different trigger.
       * `paintBlock` fires only when a block crosses between blank and
