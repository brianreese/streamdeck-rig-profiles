       * configured, which is the right economy for chrome that only changes
       * then; the subtitle is what tells two blocks of the same provider apart,
       * so it changes with the value and has to keep up with it letter by
       * letter. Nothing happens on a block that has no subtitle — the single
       * instance case, where the label is already the identity.
       */
      function paintSummary(record, key) {
        const sub = document.querySelector(`[data-hw="${CSS.escape(key)}"] .pname i`);
        if (!sub) return;
        sub.textContent = blockSummary(provOf(key), record.providers?.[key]) || 'not set up yet';
      }

      function paintBlock(record, key) {
        const card = document.querySelector(`[data-hw="${CSS.escape(key)}"]`);
        const prov = provOf(key);
        if (!card || !prov) return;

        const blank = isBlank(record.providers?.[key]);
        const raised = blank && isRaised(record, key);
        card.classList.toggle('blank', blank);
        card.classList.toggle('unset', raised);

        card.querySelector('.badge.todo, .badge.unset')?.remove();
        const badge = blankBadgeHtml(blank, raised);
        // Last among the badges, where a full render puts it.
        const anchor =
          [...card.querySelectorAll('.hw-head .badge')].pop() ?? card.querySelector('.pname');
        if (badge) anchor?.insertAdjacentHTML('afterend', badge);

        card.querySelector('.newbanner, .unsetbanner')?.remove();
        const note = blankNoteHtml(prov, blank, raised);
        // After the locked banner when there is one, so the two never swap
        // places as a block changes state.
        if (note) {
          const body = card.querySelector('.hw-body');
          const after = body?.querySelector('.lostbanner');
          if (after) after.insertAdjacentHTML('afterend', note);
          else body?.insertAdjacentHTML('afterbegin', note);
        }
      }

      /**
       * Repaint the "what this key will do" line in place.
       *
       * For the same reason `paintBlock` exists: a field edit that re-rendered
       * the pane would take the caret out of the control that caused it. The
       * line has to move all the same — filling in the first value of a
       * state-reporting block is the exact moment the key gains its on/off, and
       * a note that only caught up on the next full render would be wrong at
       * the one moment the user is looking for it.
       */
      function paintStatefulness(record) {
        const old = document.querySelector('.statenote');
        if (!old || !editingMode()) return;
        old.outerHTML = statefulnessHtml(record);
      }

      /**
       * One card per thing this profile changes, built entirely from declared
       * schemas. The editor knows nothing about wheelbases, lights or scripts:
       * a profile shows only what it has actually been given.
       */
      function providerCardsHtml(p) {
        // Driven by the record's own keys rather than by the provider list,
        // which is what lets one provider appear more than once. Ordered by the
        // provider list all the same, so the blocks keep the stable running
        // order they have always had and two instances of the same provider sit
        // together instead of at opposite ends of the pane.
        const keys = providers.flatMap((prov) => instanceKeys(p, prov.id));

        return keys.map((key) => {
          const prov = provOf(key);
          const cfg = p.providers[key] ?? {};
          const badge = prov.verifiable
            ? '' : '<span class="badge" title="This one cannot be read back">cannot confirm</span>';
          // Configured here, but no longer offered here. A provider that has
          // stopped declaring this context — or one added before the editor
          // filtered on context at all — still has to be visible, or the config
          // would be stuck on the record with no way to take it off.
          // `mode`, lower case, because that is the string a provider declares.
          // This asked for `'Mode'` — the word used in the sentence below it —
          // and so matched nothing, which put a "not for modes" badge on every
          // block of every Mode including the ones the editor had just offered.
          const stale = !(prov.contexts ?? ['profile']).includes(editingMode() ? 'mode' : 'profile')
            ? `<span class="badge" title="This provider is not offered on ${
                editingMode() ? 'modes' : 'profiles'} — remove it unless you know why it is here"
               >not for ${editingMode() ? 'modes' : 'profiles'}</span>`
            : '';
          const settingsLink = PROVIDER_SETTINGS[prov.id]
            ? `<button class="cfglink" data-goto="${esc(prov.id)}"
                 title="This provider has options in Settings">⚙ ${esc(PROVIDER_SETTINGS[prov.id])} settings</button>`
            : '';

          // A stored value whose option has gone away. The block is locked
          // rather than hidden or dropped: the value is the only record of what
          // this profile pointed at, and a config without its anchor cannot be
          // adjusted into something sensible — only kept as it is, or removed.
          // Locking is for a value known to be gone; a value that merely could
          // not be checked leaves the rest of the block alone.
          const unknowns = unknownValues(prov, cfg);
          const locked = blocksEditing(unknowns);
          const lostBadge = unknowns.length
            ? `<span class="badge ${locked ? 'bad' : ''}" title="${locked
                ? 'A value on this block no longer exists'
                : 'A value on this block could not be checked'}">${
                locked ? 'unavailable' : 'unchecked'}</span>`
            : '';
          const banner = locked
            ? `<div class="lostbanner"><b>This block is locked</b>
                 ${esc(unknowns.filter((u) => u.why === 'missing').map((u) => u.label).join(', '))}
                 no longer ${unknowns.filter((u) => u.why === 'missing').length === 1 ? 'names' : 'name'}
                 anything ${esc(prov.label)} offers, so the rest of these settings have nothing to
                 apply to. Everything is kept exactly as stored and this profile still saves —
                 remove the block with ✕ when you no longer want it.</div>`
            : '';

          // A block that has been added and not yet filled in. It is not an
          // error — nothing has gone wrong, the user simply has not finished —
          // so it is not stored and it is not painted red. It becomes red when
          // they have plainly finished with it: a `change` that leaves it empty,
          // or leaving the record with it still empty. See the block of notes
          // above `raisedBlanks`.
          const blank = isBlank(cfg);
          const raised = blank && isRaised(p, key);
          const blankBadge = blankBadgeHtml(blank, raised);
          const blankNote = blankNoteHtml(prov, blank, raised);

          // Telling two blocks of the same provider apart. A bare repeated
          // label is the failure this exists to prevent, so a record holding
          // more than one of something gets a subtitle on every one of them —
          // what it is set to, or a plain "not set up yet" while it is empty,
          // which is the state two blank blocks would otherwise share. Silent
          // for the single-block case, where the label already is the identity.
          const siblings = instanceKeys(p, prov.id).length;
          const sub = siblings > 1
            ? `<i>${esc(blockSummary(prov, cfg) || 'not set up yet')}</i>`
            : '';

          return `<div class="hw${locked ? ' locked' : ''}${blank ? ' blank' : ''}${
              raised ? ' unset' : ''}" data-hw="${esc(key)}">
            <div class="hw-head">
              <span class="pname">${esc(prov.label)}${sub}</span>${badge}${stale}${lostBadge}${blankBadge}
              <span style="flex:1"></span>${settingsLink}
              <button class="icon rm" data-rmprov="${esc(key)}"
                      title="Remove this ${esc(prov.label)} block from this profile">✕</button>
            </div>
            <div class="hw-body">${banner}${blankNote}${
              (prov.fields ?? []).map((f) => fieldHtml(prov, f, cfg, { locked, key })).join('')}</div>
          </div>`;
        }).join('');
      }

      // =====================================================================
      // Panes
      // =====================================================================

      function render() {
        // The Mode accent applies to the thing being edited, so it comes off
        // on the settings screen — otherwise Settings would wear a "Mode" pill.
        document.body.classList.toggle('editing-mode', editingMode());
        renderList();
        $('navSettings').classList.toggle('sel', view === 'settings');
        if (view === 'settings') renderSettings();
        else if (kind === 'modes') renderMode();
        else renderProfile();
        // After the pane: the save status lives inside it now, so its element
        // only exists once the pane has been drawn.
        renderSaveState();
        renderRail();
        renderIssues();
      }

      /**
       * The provider labels a record sets, for a one-line summary.
       *
       * One entry per PROVIDER, not per block: a Mode holding two flags is
       * doing one kind of thing twice, and "Rig State Flag, Rig State Flag" in
       * a sidebar subtitle reads as a rendering fault. The repeat is worth
       * knowing all the same, so it is counted rather than listed.
       */
      const providerLabels = (record) => {
        const counts = new Map();
        for (const key of Object.keys(record?.providers ?? {})) {
          const label = keyLabel(key);
          counts.set(label, (counts.get(label) ?? 0) + 1);
        }
        return [...counts].map(([label, n]) => (n > 1 ? `${label} ×${n}` : label));
      };

      /**
       * The Modes a profile also activates, one block each.
       *
       * These used to be a card of checkboxes listing every Mode that existed,
       * which meant two different ways to say "this profile also does that" —
       * hardware from the third column, Modes from a form in the middle. They
       * are the same act, so they are now added the same way and shown the same
       * way: a Mode a profile activates is a block on the profile, removed with
       * the same ✕ as a provider.
       *
       * The profile's own hardware applies first and each referenced Mode fills
       * in what the profile did not set. Where the two overlap the profile wins
       * — see profileSwitch.js — which is the right rule and completely
       * invisible from outside, so the clash is called out here.
       *
       * The reference is one-way: the profile ACTIVATES the Mode and takes no
       * further interest in it. A Mode that can report itself active goes on
       * doing so, on its own key, and the profile neither reads that nor turns
       * it off later — which is worth saying on the block itself, because a
       * Mode with an on/off state invites the assumption that the profile is
       * now tracking it.
       */
      function modeCardsHtml(p) {
        return (p.modes ?? []).map((id) => {
          const s = modes.find((x) => x.id === id);
          // A reference to a Mode that is not in the list. The editor detaches
          // references when a Mode is deleted, so this is a hand-edited config
          // — and the save is refused until it is dealt with, which it cannot be
          // if the reference is invisible.
          if (!s) {
            return `<div class="hw moderef dangling" data-hw="mode:${esc(id)}">
              <div class="hw-head">
                <span class="pname">${esc(id)}</span>
                <span class="badge">missing Mode</span>
                <span style="flex:1"></span>
                <button class="icon rm" data-rmmode="${esc(id)}"
                        title="Remove this reference">✕</button>
              </div>
              <div class="hw-body"><p class="muted">No Mode has this id. The profile
                cannot be saved until the reference is removed.</p></div>
            </div>`;
          }
          const clash = modeOverlap(p, s);
          const what = providerLabels(s);
          // Said only where it could mislead. On a Mode that cannot report
          // itself there is no "afterwards" to wonder about, and the sentence
          // would be noise on every profile in the list.
          const { stateful } = modeStatefulness(s, providers);
          return `<div class="hw moderef" data-hw="mode:${esc(s.id)}">
            <div class="hw-head">
              <span class="swatch" style="background:${esc(s.color)};color:${
                readableTextColor(s.color)}">${esc((s.name || '?').trim().charAt(0).toUpperCase())}</span>
              <span class="pname">${esc(s.name || '(unnamed)')}</span>
              <span class="badge">Mode</span>
              <span style="flex:1"></span>
              <button class="cfglink" data-editmode="${esc(s.id)}"
                      title="Open this Mode">Edit Mode</button>
              <button class="icon rm" data-rmmode="${esc(s.id)}"
                      title="Stop activating this Mode with this profile">✕</button>
            </div>
            <div class="hw-body">
              <p class="muted" style="margin:0 0 10px">
                Activated in addition to everything above. ${what.length
                  ? `Sets ${esc(what.join(', '))}.`
                  : 'Sets nothing yet.'}
                ${stateful
                  ? `<span class="aside">This Mode's own key shows whether it is on. The
                     profile switches it on and does not follow it afterwards — nothing here
                     turns it off again.</span>`
                  : ''}
                ${clash.length
                  ? `<span class="clash">Also sets ${
                      esc([...new Set(clash.map(keyLabel))].join(', '))}, which
                     this profile sets itself — the profile's setting wins.</span>`
                  : ''}
              </p>
            </div>
          </div>`;
        }).join('');
      }

      /**
       * Everything this record does, in the order it does it: its own hardware,
       * then the Modes it activates. One empty state for both, because "does
       * nothing" is one fact about the record rather than two.
       */
      function bodyCardsHtml(p) {
        if (!providers.length) return '<div class="muted">Loading options…</div>';
        const cards = providerCardsHtml(p) + (editingMode() ? '' : modeCardsHtml(p));
        if (cards) return cards;
        return `<div class="card plain"><div class="muted">
          Nothing here yet — this ${editingMode() ? 'Mode' : 'profile'} will not change
          anything when its key is pressed. Add hardware, lights, apps${
            editingMode() ? '' : ', scripts or a Mode'} from the right.
        </div></div>`;
      }

      /** Who leans on the Mode on screen, so deleting it is never a surprise. */
      function modeUsersHtml(s) {
        const users = s.id ? profilesUsingMode(profiles, s.id) : [];
        return `<div class="card plain">
          <h3>Used by</h3>
          ${users.length
            ? `<div class="users">${users.map((p) => `<button class="userchip" data-useby="${
                esc(p.id)}"><span class="swatch" style="background:${esc(p.color)};color:${
                readableTextColor(p.color)}">${esc((p.name || '?').trim().charAt(0).toUpperCase())
                }</span>${esc(p.name || '(unnamed)')}</button>`).join('')}</div>
               <div class="savenote">These profiles activate this Mode as well as setting
                 their own hardware. Deleting it removes it from them.</div>`
            : `<div class="muted">No profile activates this Mode. It still works on its own
                 key — that is what a Mode is for.</div>`}
        </div>`;
      }

      /**
       * The top of the main column: the name, edited where it is read, and the
       * save status beside it.
       *
       * The heading is the field. There was a title here and a "Name" box a few
       * centimetres below it showing the same string, and the box existed only
       * because the title was not editable — so the title is editable now and
       * the box is gone. `data-f="name"` is what `holdForNaming` looks for, so
       * an unsaved record still holds its first save until the caret leaves,
       * and its id is slugged from the finished name rather than a fragment.
       */
      function paneTopHtml(record, noun) {
        const editable = Boolean(record);
        const title = editable
          ? `<h2 id="pname" class="editable" contenteditable="plaintext-only" data-f="name"
               data-noun="${esc(noun)}" spellcheck="false" role="textbox"
               aria-label="${esc(noun)} name">${esc(record.name ?? '')}</h2>`
          : `<h2>${esc(noun)}</h2>`;

        return `<div class="pane-top">
          <div class="titlewrap">
            ${title}
            ${editingMode() && editable ? '<span class="pill">Mode</span>' : ''}
            ${editable && !editingMode()
              ? `<span class="pill hold" id="holdPill"${record.restricted ? '' : ' hidden'}
                 >Hold to switch</span>`
              : ''}
            ${editable ? cogHtml(record) : ''}
          </div>
          <div id="saveState" class="savestrip"></div>
        </div>`;
      }

      /**
       * The cog: what you do TO this record, rather than what it is.
       *
       * Three things that had no home. The id was printed under the title where
       * it was read constantly and needed rarely; the hold gate was a form row
       * among the settings that make the key work, though it decides who may
       * press it; and delete sat in the far column beside "add", one flick of
       * the wrist from it. None of them belongs in the flow of editing, and one
       * of them is destructive, so they are behind a deliberate click.
       */
      function cogHtml(record) {
        const mode = editingMode();
        const noun = mode ? 'Mode' : 'profile';
        return `<span class="cogwrap" id="cogwrap">
          <button id="cog" title="${esc(noun)} settings" aria-haspopup="true"
                  aria-expanded="false">⚙</button>
          <div class="cogmenu" role="menu">
            ${mode ? '' : `<h4>Switching</h4>
              <div class="grp">
                <input type="checkbox" id="holdToggle" data-f="restricted"
                       ${record.restricted ? 'checked' : ''} />
                <label for="holdToggle" class="muted" style="cursor:pointer">
                  <b style="color:var(--fg);font-weight:600">Hold to switch</b><br />
                  Requires a 1s press. Use for full-torque profiles.
                </label>
              </div>
              <div class="sep"></div>`}
            <h4>Stored as</h4>
            <div class="muted">${record.id
              ? `<code>${esc(record.id)}</code> — permanent. Renaming this ${noun} does not
                 change it, so anything pointing at it keeps working.`
              : `Not saved yet. The id is made from the name the first time this ${noun}
                 saves, and is permanent afterwards.`}</div>
            <div class="sep"></div>
            <button class="danger wide" data-act="remove">Delete ${noun}</button>
            <div class="savenote">${deleteCost(record)}</div>
          </div>
        </span>`;
      }

      /** What deleting this record costs, said before it is clicked. */
      function deleteCost(record) {
        if (!editingMode()) return 'Keys bound to it stop working.';
        const users = record.id ? profilesUsingMode(profiles, record.id) : [];
        return users.length
          ? `Used by ${users.length} profile${users.length === 1 ? '' : 's'}: ${
              esc(users.map((u) => u.name || u.id).join(', '))}. Deleting it removes it from
             them; they keep everything else.`
          : 'No profile references it.';
      }

      /**
       * What this Mode's key will DO, said in words beside the picture of it.
       *
       * The one fact about a Mode that cannot be read off the screen. Two Modes
       * can hold the same three blocks and behave differently: if any provider
       * inside can answer "am I in effect?", the key carries an on/off state,
       * and if none can, the key runs the Mode and is done. The capability is
       * invisible — there is no column for it, and no sensible place to put one,
       * because it is not a setting anybody chooses.
       *
       * So it is stated, next to the tiles it changes the meaning of, and it
       * moves as the Mode is built. This is the answer to "one action, two
       * behaviours": the user is never left to infer which one they have got.
       *
       * Three things it is careful about:
       *
       *   * it names the providers responsible. "This key shows state" invites
       *     "because of what?", and the answer is the useful part — it is also
       *     what tells the user which block to remove to change it;
       *   * it says what the non-reporting providers do NOT contribute, but only
       *     when there are some. A Mode of nothing but state-reporters needs no
       *     such caveat;
       *   * a block holding nothing is not stored and therefore reports nothing,
       *     so it does not count — but a state-reporting block that is merely
       *     unfinished is called out rather than ignored. Adding the one
       *     provider that would make the key stateful and seeing this text not
       *     move would read as the editor missing it.
       */
      function statefulnessHtml(record) {
        const { stateful, reporters, quiet, pending } = modeStatefulness(record, providers);
        const list = (xs) => esc(xs.join(', '));

        if (stateful) {
          return `<div class="statenote on">
            <b>This key will show whether the Mode is on.</b>
            ${list(reporters)} can report whether ${reporters.length === 1 ? 'it is' : 'they are'}
            currently in effect, so the key is drawn active while this Mode is on and inactive
            while it is not.${quiet.length
              ? ` ${list(quiet)} cannot answer that question, so ${quiet.length === 1 ? 'it runs' : 'they run'}
                 without counting towards the verdict.`
              : ''}
          </div>`;
        }

        // Nothing added at all is its own case: "nothing in it can report" is a
        // strange thing to say about an empty Mode, and the answer is different
        // — add anything, rather than remove or finish something.
        if (!Object.keys(record?.providers ?? {}).length) {
          return `<div class="statenote off">
            <b>This key will just run the Mode.</b>
            Nothing has been added to it yet. If you add something that can report whether it
            is in effect, the key gains an on/off state; otherwise it fires and is over.
          </div>`;
        }

        return `<div class="statenote off">
          <b>This key will just run the Mode.</b>
          Nothing in it can report whether it is currently in effect, so the key has no on/off
          state — it fires and is over, which is what the two tiles show.
          ${pending.length
            ? `${list(pending)} could report ${pending.length === 1 ? 'its' : 'their'} state,
               but ${pending.length === 1 ? 'has' : 'have'} nothing chosen yet — finish
               ${pending.length === 1 ? 'it' : 'them'} and this key gains one.`
            : 'Add something that can report its own state and this key gains one.'}
        </div>`;
      }

      /**
       * The key preview and the two things that change it.
       *
       * Colour and avatar are not facts about the profile, they are the picture
       * on the key — so they sit with the picture, where a change and its effect
       * are the same glance apart. A Mode gets the colour and not the avatar:
       * avatars are stored per id in one shared directory, and a profile and a
       * Mode are allowed to share an id, so a Mode avatar would silently
       * overwrite the profile's.
       *
       * A Mode also gets a line saying what its key will do, because the tiles
       * alone cannot say it — see `statefulnessHtml`.
       */
      function deckHtml(record) {
        const mode = editingMode();
        const tiles = mode
          ? `<figure><img id="prevIdle" alt="" /><figcaption>idle</figcaption></figure>
             <figure><img id="prevRunning" alt="" /><figcaption>running</figcaption></figure>`
          : `<figure><img id="prevOff" alt="" /><figcaption>inactive</figcaption></figure>
             <figure><img id="prevBusy" alt="" /><figcaption>switching</figcaption></figure>
             <figure><img id="prevOn" alt="" /><figcaption>active &amp; confirmed</figcaption></figure>`;

        return `<div class="card plain">
          <h3>On the deck</h3>
          <div class="deck">
            <div class="tiles">${tiles}</div>
            <div class="look">
              <div class="row">
                <label>Colour</label>
                <div class="grp">
                  <input type="color" data-f="color" value="${esc(record.color)}"
                         title="Key colour" />
                  <span class="muted">The key's ground, and the swatch in the list.</span>
                </div>
              </div>
              ${mode ? '' : `<div class="row">
                <label>Avatar</label>
                <div class="grp">
                  <img class="avatar-preview" id="avatarPreview" src="${record.avatarDataUri || ''}"
                       style="${record.avatarDataUri ? '' : 'visibility:hidden'}" alt="" />
                  <input type="file" data-f="avatar" accept=".png,.jpg,.jpeg,.gif,.webp,.svg" />
                  ${record.avatar
                    ? '<button class="icon rm" data-act="rmavatar" title="Remove avatar">✕</button>'
                    : ''}
                </div>
              </div>`}
              <div class="savenote">Rendered by the plugin itself, so what you see is what
                the key will show.</div>
            </div>
          </div>
          ${mode ? statefulnessHtml(record) : ''}
        </div>`;
      }

      function renderMode() {
        const s = current();
        if (!s) {
          $('pane').innerHTML = `<div class="pane-inner">
            ${paneTopHtml(null, 'No Mode selected')}
            <p class="sub">Pick one on the left, or make a new one with “+ New Mode”.
              A Mode is something the rig does — lights, VR, a playlist, a script —
              without changing who is at it. Some report whether they are on; the rest
              simply run.</p></div>`;
          return;
        }

        $('pane').innerHTML = `<div class="pane-inner">
          ${paneTopHtml(s, 'Mode')}
          <div id="issues"></div>
          ${deckHtml(s)}
          ${bodyCardsHtml(s)}
          ${modeUsersHtml(s)}
        </div>`;

        refreshPreview();
      }

      function renderProfile() {
        const p = current();
        if (!p) {
          $('pane').innerHTML = `<div class="pane-inner">
            ${paneTopHtml(null, 'No profile selected')}
            <p class="sub">Pick one on the left, or make a new one with “+ New profile”.</p>
            </div>`;
          return;
        }

        // Order matters here: what the key will look like comes first, because
        // that is the thing being made. The fields that produce it follow.
        $('pane').innerHTML = `<div class="pane-inner">
          ${paneTopHtml(p, 'profile')}
          <div id="issues"></div>
          ${deckHtml(p)}
          ${bodyCardsHtml(p)}
        </div>`;

        refreshPreview();
      }

      /**
       * The same renderer the deck uses, so an overflowing name or a colour that
       * swallows the label is visible here rather than after saving. Debounced:
       * this re-renders on every keystroke otherwise.
       *
       * A Mode gets its own two states from `previewModeKey`, not the
       * profile's three. It has no "active and confirmed" — it fires and it is
       * over — so borrowing that tile would claim something untrue about the key.
       */
      function refreshPreview() {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(async () => {
          const p = current();
          if (!p) return;

          if (editingMode()) {
            const idle = $('prevIdle');
            if (!idle) return;
            const reply = await ask('previewModeKey', {
              mode: { name: p.name, color: p.color, avatar: p.avatar },
            });
            if (!reply.idle) return;
            idle.src = reply.idle;
            $('prevRunning').src = reply.running;
            return;
          }

          const off = $('prevOff');
          if (!off) return;
          const reply = await ask('previewKey', {
            profile: { name: p.name, color: p.color, avatar: p.avatar },
          });
          if (!reply.off) return;
          off.src = reply.off;
          $('prevBusy').src = reply.busy;
          $('prevOn').src = reply.on;
        }, 200);
      }

      function renderSettings() {
        const devices = Array.isArray(hardware.goveeDevices)
          ? hardware.goveeDevices.join(', ') : (hardware.goveeDevices ?? '');

        // These three read as `!== false` on the provider side, so an absent key
        // means enabled. The boxes therefore start ticked when nothing has been
        // stored, and commit() writes a literal false when one is cleared —
        // saving `undefined` would silently turn the setting back on.
        const autoStart = hardware.fanatecAutoStart !== false;

        const reopenPit = hardware.mozaReopenPitHouse === true;

        $('pane').innerHTML = `<div class="pane-inner">

            <div class="row">

                <span class="muted">Start it when switching profiles</span>

              <div class="help">
                The service is what actually applies a setup change. Without it the
                command is accepted by the broker and nothing happens — a switch that
                looks like it worked and did not. Turn this off only if you start the

            </div>
          </div>

          <div class="card" data-sec="moza">

            <div class="row">

              <div class="grp">

                <span class="muted">Close it when switching profiles</span>
              </div>
              <div class="help">
                The pedal's serial port is exclusive, so Pit House has to be closed for a
                profile to reach the pedal at all. Turn this off only if you would rather
                close it by hand and have the switch fail on the times you forget.
              </div>
            </div>
            <div class="row">
              <label>Reopen afterwards</label>
              <div class="grp">
                <input type="checkbox" id="mozaReopen" ${reopenPit ? 'checked' : ''}
                       ${closePit ? '' : 'disabled'} />
                <span class="muted">Launch Pit House again once the profile is applied</span>
              </div>
              <div class="help">
                Worth leaving off. Pit House re-applies its own preset as it starts, which
                undoes the pedal settings the profile has just written.
              </div>
            </div>
          </div>

          <div class="card" data-sec="govee">
            <h3>Govee lighting</h3>
            <div class="row">
              <label for="goveeKey">API key</label>
              <div class="grp">
                <input type="password" id="goveeKey" autocomplete="off"
                       placeholder="${hardware.goveeApiKeySet ? '•••••••• (saved)' : 'not set'}" />
                <button id="goveeShow" class="icon" title="Show the key">👁</button>
              </div>
              <div class="help">${hardware.goveeApiKeySet
                ? 'A key is saved. Type a new one to replace it; leave blank to keep it. Saved when you click away from the field.'
                : 'Free key from developer.govee.com. Kept in secrets.json, outside the settings that get exported or backed up. Saved when you click away from the field.'}</div>
            </div>
            <div class="row">
              <label for="goveeDevices">Only these devices</label>
              <input type="text" id="goveeDevices" placeholder="all devices" value="${esc(devices)}" />
              <div class="help">
                Optional. Comma-separated device names, so Govee scenes do not fire at lamps
                elsewhere in the house.

            </div>
            <div class="actions"><button id="goveeDiscover">Discover devices</button></div>
          </div>

          <div class="card" data-sec="backup">
            <h3>Backup</h3>
            <p class="muted" style="margin-top:0">
              A complete snapshot: profiles, Modes, settings and avatars, in one file.

            <div id="backupStatus" class="help">Checking…</div>

            <div id="dropZone" class="dropzone">
              <strong>Restore from a file</strong>
              <div class="help">Drop a <code>.json</code> backup or a <code>.yaml</code> export here, or</div>

          <div class="card" data-sec="yaml">

      // =====================================================================
      // Right rail — everything you can DO, in one column
      // =====================================================================

      /**
       * One row in the third column, whether it is a provider or a Mode.
       *
       * A repeatable provider never goes grey. However many instances are
       * already on the record there is another one to add — a Mode asserting
       * `vr` on and `assists` off needs the row to still work after the first —
       * so it keeps its `+` and says how many it has put there instead. The
       * old rule stands for everything else: one is the limit, and the row
       * greys out to say so rather than vanishing.
       */
      function offerHtml(offer) {
        const mode = offer.type === 'mode';
        const mark = offer.added
          ? '<span class="tick">✓</span>'
          : `<span class="plus">+</span>${
              offer.count ? `<span class="count" title="${offer.count} on this ${
                kind === 'modes' ? 'Mode' : 'profile'} already">${offer.count}</span>` : ''}`;
        // A mode is identified by its colour everywhere else in the editor, so
        // it is identified by its colour here too.
        const face = mode
          ? `<span class="sw" style="background:${esc(offer.mode.color)};color:${
              readableTextColor(offer.mode.color)}">${
              esc((offer.label || '?').trim().charAt(0).toUpperCase())}</span>`
          : '';
        const sub = offer.added
          ? 'already added'
          : mode
            ? (providerLabels(offer.mode).join(', ') || 'nothing configured')
            : offer.count
              ? `add another — ${offer.count} on this ${kind === 'modes' ? 'Mode' : 'profile'}`
              : (offer.provider.verifiable ? '' : 'cannot be confirmed');

        return `<button class="addbtn${mode ? ' mode' : ''}${offer.count && !offer.added ? ' again' : ''}"
          data-add="${mode ? 'mode' : 'provider'}:${esc(offer.id)}"
          ${offer.added ? 'disabled title="Already on this profile"' : ''}>
          ${mark}${face}
          <span class="nm">${esc(offer.label)}${sub ? `<i>${esc(sub)}</i>` : ''}</span>
        </button>`;
      }

      /**
       * The third column: everything that can be added to the thing on screen,
       * providers and modes in one searchable list.
       *
       * They were in two places — hardware here, modes in a card in the middle
       * of the profile — for no reason the user could see: both answer "what
       * else should this do?". One list, one search box over it, and an entry
       * that has been used stays where it was and greys out rather than
       * vanishing under the cursor.
       */
      function renderRail() {
        const parts = [];
        $('rail').classList.toggle('nosearch', view === 'settings');

        if (view === 'settings') {
          parts.push(`<div class="rail-group"><h4>Jump to</h4>
            ${[['fanatec-base', 'Fanatec wheelbase'], ['moza', 'MOZA pedal'],
               ['govee', 'Govee lighting'], ['backup', 'Backup'],
               ['history', 'Version history'], ['yaml', 'Export YAML']]
              .map(([sec, label]) =>
                `<button class="addbtn" data-jump="${sec}"><span class="nm">${esc(label)}</span></button>`)
              .join('')}</div>`);
          parts.push(`<div class="rail-group"><h4>Hardware</h4>
            <button id="refreshHardware" class="wide">Refresh options</button>
            <div class="savenote">Re-asks the wheelbase for its setup slots and Pit House for
              its presets.</div></div>`);
        } else {
          const p = current();
          const noun = kind === 'modes' ? 'Mode' : 'profile';

          if (!p) {
            parts.push(`<div class="rail-group"><h4>${kind === 'modes' ? 'Modes' : 'Profiles'}</h4>
              <div class="savenote">Pick a ${noun} on the left, or make one with
                “+ New ${noun}”, and what you can add to it appears here.</div></div>`);
          } else if (!providers.length) {
            parts.push('<div class="rail-group"><div class="savenote">Loading options…</div></div>');
          } else {
            const query = $('railSearch').value;
            const all = offers({ providers, modes, record: p, kind, query });
            // Not `hardware`: that is the global settings draft, and shadowing
            // it here would be one rename away from writing to the wrong thing.
            const kit = all.filter((o) => o.type === 'provider');
            const modeOffers = all.filter((o) => o.type === 'mode');

            parts.push(`<div class="rail-group"><h4>Add to this ${noun}</h4>${
              kit.length
                ? kit.map(offerHtml).join('')
                : `<div class="savenote">${query.trim()
                    ? 'Nothing here matches that search.'
                    : `Nothing can be added to a ${noun}.`}</div>`
            }</div>`);

            // Modes are offered on profiles and nowhere else: a mode running a
            // Mode would be a graph to resolve, for a feature nobody has asked
            // for. So the group is simply absent while editing a Mode.
            if (kind !== 'modes') {
              parts.push(`<div class="rail-group"><h4>Modes</h4>${
                modeOffers.length
                  ? modeOffers.map(offerHtml).join('') +
                    `<div class="savenote">The profile activates the Mode as well as setting
                      its own hardware, and takes no further interest in it — a Mode that
                      reports itself on stays the business of its own key. A Mode never
                      changes who the rig thinks is at it.</div>`
                  : `<div class="savenote">${query.trim()
                      ? 'No Mode matches that search.'
                      : `No saved Modes yet. Make one under <b>Modes</b> on the left and it
                         will be offered here.`}</div>`
              }</div>`);
            }
          }
        }

        $('railBody').innerHTML = parts.join('');
      }

      // =====================================================================
      // Edits
      // =====================================================================

      // Profiles and modes are edited by the same handler because they are
      // edited through the same fields: a mode simply never renders the ones
      // that are profile-only, so those branches never fire for it.
      function onRecordInput(e) {
        const el = e.target;
        const p = current();
        if (!p) return;

        /**
         * The block this edit landed in has just changed shape.
         *
         * A block that now holds something is no longer blank, and stops being
         * flagged whatever it was before. A block that is still empty after a
         * `change` has been decided upon — "— none —" is an answer — and gets
         * one back. `input` is not a decision: clearing a textarea to retype it
         * is mid-thought, and going red under the caret would be exactly the
         * rudeness this whole change is about.
         */
        function settled(key) {
          const empty = isBlank(p.providers?.[key]);
          if (!empty) setRaised(p, key, false);
          else if (e.type === 'change') setRaised(p, key, true);

          // The one thing that follows every keystroke, because it is what
          // distinguishes this block from the other one headed with the same
          // provider name.
          paintSummary(p, key);

          // Most edits do not move the block between states — typing into a
          // textarea that already has text in it is every keystroke of a long
          // command list — and repainting the sidebar for each of those is work
          // nobody asked for. Compare against what is already on screen.
          const card = document.querySelector(`[data-hw="${CSS.escape(key)}"]`);
          const unchanged =
            card &&
            card.classList.contains('blank') === empty &&
            card.classList.contains('unset') === (empty && isRaised(p, key));
          if (unchanged) return;

          paintBlock(p, key);
          // A block crossing between blank and configured is exactly what can
          // add or remove this Mode's on/off state, so the line that says so
          // moves with it.
          paintStatefulness(p);
          renderList();     // the marker on the row follows the block
        }

        // Enabling or disabling one slider.
        if (el.dataset.fldon) {
          // Block key first, field key second. The block key may carry an
          // instance suffix and the separator is `|`, which neither half can
          // contain, so the split is safe for `state-flag#2|whenOff`.
          const [blockKey, key] = el.dataset.fldon.split('|');
          const cfg = (p.providers[blockKey] = p.providers[blockKey] ?? {});
          const slider = document.querySelector(`input[type="range"][data-fld="${el.dataset.fldon}"]`);
          const readout = document.querySelector(`[data-rv="${el.dataset.fldon}"]`);
          const unit = readout?.dataset.unit ?? '';
          if (el.checked) {
            cfg[key] = Number(slider.value);
            slider.disabled = false;
            readout.textContent = slider.value + unit;
            readout.classList.remove('off');
          } else {
            delete cfg[key];
            slider.disabled = true;
            readout.textContent = 'not set';
            readout.classList.add('off');
          }
          settled(blockKey);
          touch('draft');
          return;
        }

        if (el.dataset.fld) {
          const [blockKey, key] = el.dataset.fld.split('|');
          const cfg = (p.providers[blockKey] = p.providers[blockKey] ?? {});
          const value = fieldValue(el.type === 'checkbox' ? el.checked : el.value);
          if (value === undefined) delete cfg[key];
          else cfg[key] = value;
          const readout = document.querySelector(`[data-rv="${el.dataset.fld}"]`);
          if (readout && el.type === 'range') readout.textContent = el.value + (readout.dataset.unit ?? '');
          delete p.needsWheelbaseSetup;
          settled(blockKey);
          touch('draft');
          return;
        }

        const field = el.dataset.f;
        if (!field) return;
        if (field === 'name') {
          // The heading IS the field, so nothing here may write to it: setting
          // its text mid-word would put the caret back at the start. The list
          // row and the key preview follow it instead.
          p.name = headingText(el);
          renderList();
          refreshPreview();
          touch('draft');
        } else if (field === 'color') {
          p.color = el.value;
          renderList();
          refreshPreview();
          touch('draft');
        } else if (field === 'restricted') {
          p.restricted = el.checked;
          // Toggled in place rather than re-rendered: this control lives in an
          // open menu, and redrawing the pane would close it underneath the
          // click that opened it.
          $('holdPill')?.toggleAttribute('hidden', !el.checked);
          touch('draft');
        } else if (field === 'avatar' && el.files?.[0]) {
          uploadAvatar(p, el.files[0]);
        }
      }

      /**
       * The name as typed into the heading.
       *
       * `contenteditable="plaintext-only"` keeps markup out, but a browser will
       * still put a newline in for Enter on some paths and a paste can carry
       * leading whitespace; a name with a line break in it renders as a key
       * label with a line break in it. Collapsed here, at the one place the
       * value is read, rather than trusted to every caller.
       */
      const headingText = (el) => el.textContent.replace(/\s+/g, ' ').trim();

      function onSettingsInput(e) {
        const el = e.target;
        if (el.id === 'goveeKey') {
          // Deliberately not saved per keystroke: saveSettings treats a blank
          // key as "leave it alone", so an autosave halfway through typing
          // would replace a working key with a fragment of a new one. Marked
          // dirty on every keystroke all the same, so the state on screen and
          // the unload warning are both honest.
          hardware.goveeApiKey = el.value.trim();
          touch('settings', { defer: e.type === 'input' });
          return;
        }
        if (el.id === 'goveeDevices') {
          const raw = el.value.trim();
          hardware.goveeDevices = raw ? raw.split(',').map((x) => x.trim()).filter(Boolean) : null;
          touch('settings');
          return;
        }
        if (el.id === 'fanatecAutoStart') {
          hardware.fanatecAutoStart = el.checked;
          touch('settings');
          return;
        }
        if (el.id === 'mozaClose') {
          hardware.mozaClosePitHouse = el.checked;
          // Reopening only means anything if we closed it. Toggled in place
          // rather than by re-rendering, which would wipe a half-typed API key.
          const reopen = $('mozaReopen');
          if (reopen) reopen.disabled = !el.checked;
          touch('settings');
          return;
        }
        if (el.id === 'mozaReopen') {
          hardware.mozaReopenPitHouse = el.checked;
          touch('settings');
        }
      }

      async function uploadAvatar(p, file) {
        if (!p.id) p.id = slugify(p.name, profiles.map((d) => d.id).filter(Boolean));
        const base64 = await new Promise((res) => {
          const r = new FileReader();
          r.onload = () => res(String(r.result).split(',')[1]);
          r.readAsDataURL(file);
        });
        const reply = await ask('uploadAvatar', { profileId: p.id, base64, filename: file.name });
        if (!reply.ok) return say(reply.error, 'err');

        p.avatar = reply.filename;
        p.avatarDataUri = (await ask('getAvatar', { profileId: p.id, filename: reply.filename })).dataUri;
        say('Avatar stored.', 'ok');
        render();
        touch('draft', { now: true });
      }

      async function removeAvatar(p) {
        if (p.avatar) await ask('deleteAvatar', { profileId: p.id, filename: p.avatar });
        delete p.avatar;
        delete p.avatarDataUri;
        render();
        touch('draft', { now: true });
      }

      /**
       * Delete a Mode, saying first what else it takes with it.
       *
       * A profile references a Mode by id, so deleting one out from under a
       * profile would leave a reference to nothing: the profile would still
       * claim to activate the Mode, the runtime would skip it with a log line
       * nobody reads, and the lights would simply not come on. Two things stop
       * that. The confirm names every profile that references it — so the
       * decision is made with the cost visible — and the references are then
       * removed, so no profile is left pointing at a Mode that is gone.
       */
      function deleteMode(s) {
        const users = s.id ? profilesUsingMode(profiles, s.id) : [];
        const warning = users.length
          ? `\n\nIt is used by ${users.length} profile${users.length === 1 ? '' : 's'}: ` +
            `${users.map((p) => p.name || p.id).join(', ')}.\n` +
            `They will stop activating it. Everything else about them is unchanged.`
          : '';
        if (!confirm(`Delete the Mode "${s.name}"?${warning}`)) return;

        const detached = detachMode(profiles, s.id);
        ({ profiles: modes, selected: selectedMode } = removeProfile(modes, s));
        render();
        touch('draft', { now: true });
        say(
          detached.length
            ? `Mode deleted, and removed from ${detached.map((p) => p.name || p.id).join(', ')}.`
            : 'Mode deleted.',
          'ok',
        );
      }

      /**
       * Keep the open menu inside the pane.
       *
       * It hangs from the cog, and the cog sits after the name — so a long name
       * pushes it right until the menu would hang off the edge. `#pane` scrolls
       * vertically, which means the browser gives it a horizontal scrollbar for
       * anything sticking out sideways, and the menu would be half off-screen
       * behind one. Measured and pulled back rather than pinned to one side:
       * under the cog is where it belongs whenever there is room for it.
       */
      function placeCog() {
        const menu = document.querySelector('.cogmenu');
        const pane = $('pane');
        if (!menu || !pane) return;
        menu.style.left = '0px';
        // clientWidth, not the bounding box: the vertical scrollbar is not space
        // the menu can use.
        const limit = pane.getBoundingClientRect().left + pane.clientWidth - 14;
        const over = menu.getBoundingClientRect().right - limit;
        if (over > 0) menu.style.left = `${-over}px`;
      }

      /** Shut the cog menu. Safe when there is none — most panes have no cog. */
      function closeCog() {
        const wrap = $('cogwrap');
        if (!wrap?.classList.contains('open')) return;
        wrap.classList.remove('open');
        $('cog')?.setAttribute('aria-expanded', 'false');
      }

      // A menu that only closes from inside is a menu that follows you around.
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#cogwrap')) closeCog();
      });

      /** Show a settings section and say which one, for a link from a provider. */
      function gotoSettings(section) {
        view = 'settings';
        render();
        const target = document.querySelector(`[data-sec="${section}"]`);
        if (!target) return;
        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
        target.classList.remove('flash');
        void target.offsetWidth;              // restart the animation
        target.classList.add('flash');
      }

      // =====================================================================
      // Load
      // =====================================================================

      async function loadProfiles() {
        const reply = await ask('getProfiles');
        if (reply.ok === false) return say(reply.error, 'err');
        profiles = reply.profiles ?? [];
        modes = reply.modes ?? [];
        hardware = reply.settings ?? {};
        for (const p of profiles) {
          if (!p.providers) p.providers = {};
          // The key a profile's Mode references used to live under. Read here
          // and dropped from the draft, so the next save writes only `modes`
          // and the config heals itself. This is not a migration layer and must
          // not grow into one — it exists because piBridge reads the Mode LIST
          // tolerantly, and reading the list while discarding every reference
          // to it would leave a config half-alive, which is worse than either
          // being tolerant or not.
          if (p.scenes && !p.modes) { p.modes = p.scenes; delete p.scenes; }
          if (p.avatar) {
            p.avatarDataUri = (await ask('getAvatar', { profileId: p.id, filename: p.avatar })).dataUri;
          }
        }
        // No avatars on Modes: a Mode is not a person. Only the providers map
        // needs defaulting, so an older record without one still edits.
        for (const s of modes) if (!s.providers) s.providers = {};

        // Every record is a fresh object, so the old notes key nothing.
        //
        // A blank block that arrived from storage was never added in this
        // session, so there is no grace to give it: the editor did not write it
        // — nothing here ever stores a blank block — which means a hand-edited
        // config put it there, and it is exactly the config that used to be
        // unsaveable. It starts flagged, and it is left out of the next save.
        raisedBlanks = new WeakMap();
        for (const r of [...profiles, ...modes]) {
          for (const id of blankBlocks(r)) setRaised(r, id, true);
        }

        selectedProfile = keepSelection(profiles, selectedProfile);
        selectedMode = keepSelection(modes, selectedMode);
      }

      async function loadProviders() {
        // Schemas with live hardware options folded in — the wheelbase is asked
        // for its slots here, which is why this costs a moment on a cold base.
        const reply = await ask('getProviders');
        providers = reply.providers ?? [];
      }

      // =====================================================================
      // Wire
      // =====================================================================

      $('search').addEventListener('input', renderList);

      $('seg').addEventListener('click', (e) => {
        const b = e.target.closest('[data-kind]');
        if (b && b.dataset.kind !== kind) setKind(b.dataset.kind);
      });

      /** The record a sidebar row stands for, or null. Whichever list is shown. */
      const rowRecord = (target) => {
        const li = target.closest?.('li[data-i]');
        return li ? listOf()[Number(li.dataset.i)] ?? null : null;
      };

      $('list').addEventListener('click', (e) => {
        // "+ New" is the last row of the list rather than a fixture below it,
        // so it is handled here with the rows.
        if (e.target.closest('[data-new]')) return newRecord();
        const p = rowRecord(e.target);
        if (!p) return;
        // Clicking the row you are already on is not going anywhere, so it must
        // not count as walking away from a block you are still filling in.
        // Neither is arriving from Settings, where no record was on screen.
        if (view === 'editor' && p !== current()) leaveRecord();
        select(p);
        view = 'editor';
        render();
      });

      // Drag to reorder. Order is what the inspector's dropdown shows, so it is
      // worth arranging: the profiles used daily belong at the top.
      let dragging = null;
      $('list').addEventListener('dragstart', (e) => {
        dragging = rowRecord(e.target);
        if (dragging) e.dataTransfer.effectAllowed = 'move';
      });
      $('list').addEventListener('dragover', (e) => {
        const li = e.target.closest('li[data-i]');
        if (!li || !dragging) return;
        e.preventDefault();
        const after = e.offsetY > li.offsetHeight / 2;
        document.querySelectorAll('#list li').forEach((n) =>
          n.classList.remove('drop-before', 'drop-after'));
        li.classList.add(after ? 'drop-after' : 'drop-before');
      });
      $('list').addEventListener('drop', (e) => {
        const li = e.target.closest('li[data-i]');
        const onto = rowRecord(e.target);
        if (!onto || !dragging) return;
        e.preventDefault();
        const moved = moveProfile(listOf(), dragging, onto, e.offsetY > li.offsetHeight / 2);
        if (kind === 'modes') modes = moved;
        else profiles = moved;
        dragging = null;
        render();
        touch('draft');
      });

      // A drag released outside the list leaves its insertion marker behind.
      $('list').addEventListener('dragend', () => {
        dragging = null;
        document.querySelectorAll('#list li').forEach((n) =>
          n.classList.remove('drop-before', 'drop-after'));
      });

      /** Add to whichever list is showing, and land the caret in its name. */
      function newRecord() {
        leaveRecord();
        if (kind === 'modes') ({ modes, selected: selectedMode } = addMode(modes));
        else ({ profiles, selected: selectedProfile } = addProfile(profiles));
        view = 'editor';
        render();
        // Focused and its text selected so the first keystroke names it. The id
        // is slugged from this name, and commit() waits for the caret to leave.
        selectHeading();
        touch('draft');
      }

      /**
       * Put the caret in the name heading with its placeholder text selected.
       *
       * `select()` belongs to form controls; the heading is an editable element,
       * so the selection has to be made by hand.
       */
      function selectHeading() {
        const name = $('pname');
        if (!name) return;
        name.focus();
        const range = document.createRange();
        range.selectNodeContents(name);
        const sel = getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      $('navSettings').addEventListener('click', () => {
        leaveRecord();
        view = 'settings';
        render();
      });
      // The third column searches what it is offering. Only the body redraws,
      // so the caret stays where it is.
      $('railSearch').addEventListener('input', renderRail);

      $('pane').addEventListener('input', paneEdit);
      $('pane').addEventListener('change', paneEdit);
      function paneEdit(e) {
        if (view === 'settings') onSettingsInput(e);
        else onRecordInput(e);
      }

      // Enter in the key field means "I am done with this", same as clicking away.
      $('pane').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.id === 'goveeKey') { e.preventDefault(); commit(); }

        // Enter in the name heading means the same, and must not insert a line
        // break: a key label is one line. Blurring is what releases the hold on
        // the first save, so the name commits and the id is slugged.
        if (e.key === 'Enter' && e.target.id === 'pname') {
          e.preventDefault();
          e.target.blur();
        }
        if (e.key === 'Escape') closeCog();
      });

      /**
       * Paste into the heading, as text.
       *
       * `contenteditable="plaintext-only"` does this itself where it is
       * supported. Where it is not, the attribute is invalid and falls back to
       * plain `true` — and a name pasted out of a document would arrive with its
       * markup, and its line breaks, inside the heading. The stored name is read
       * as text either way, so the two would silently disagree.
       */
      $('pane').addEventListener('paste', (e) => {
        if (e.target.id !== 'pname') return;
        e.preventDefault();
        const text = (e.clipboardData?.getData('text/plain') ?? '').replace(/\s+/g, ' ');
        const sel = getSelection();
        if (!sel?.rangeCount) return;
        sel.deleteFromDocument();
        sel.getRangeAt(0).insertNode(document.createTextNode(text));
        sel.collapseToEnd();
        e.target.dispatchEvent(new Event('input', { bubbles: true }));
      });

      // A name that has been left is a name that is finished, so the id can be
      // slugged from it. Also the moment to tidy what was typed: the record
      // holds the collapsed name, and the heading should show the same string.
      $('pane').addEventListener('focusout', (e) => {
        if (e.target.id !== 'pname') return;
        const p = current();
        if (!p) return;
        const tidy = headingText(e.target);
        if (e.target.textContent !== tidy) e.target.textContent = tidy;
        p.name = tidy;
        if (isDirty()) commit();
      });

      $('pane').addEventListener('click', async (e) => {
        const p = current();

        // The cog. Toggled rather than opened, and left open while its own
        // controls are used — the hold toggle lives inside it.
        if (e.target.closest('#cog')) {
          const wrap = $('cogwrap');
          const open = !wrap.classList.contains('open');
          wrap.classList.toggle('open', open);
          $('cog').setAttribute('aria-expanded', String(open));
          if (open) placeCog();
          return;
        }
        if (!e.target.closest('.cogmenu')) closeCog();

        if (e.target.id === 'saveNow') return commit();

        const goto = e.target.closest('[data-goto]');
        if (goto) return gotoSettings(goto.dataset.goto);

        // Delete, from the cog. The confirm names what it costs, which for a
        // mode is the profiles that reference it.
        if (e.target.closest('[data-act="remove"]') && p) {
          if (editingMode()) return deleteMode(p);
          if (!confirm(`Delete "${p.name}"? Keys bound to it will stop working.`)) return;
          ({ profiles, selected: selectedProfile } = removeProfile(profiles, p));
          render();
          touch('draft', { now: true });
          return;
        }

        // Stop running a mode with this profile. The mode itself is untouched
        // — this is the reference being cut, not the thing referenced.
        const rmMode = e.target.closest('[data-rmmode]');
        if (rmMode && p) {
          setModeRef(p, rmMode.dataset.rmmode, false);
          render();
          touch('draft');
          return;
        }

        const editMode = e.target.closest('[data-editmode]');
        if (editMode) {
          const target = modes.find((s) => s.id === editMode.dataset.editmode);
          if (target) {
            selectedMode = target;
            setKind('modes');
          }
          return;
        }

        // A chip on the mode's "Used by" list: go and look at that profile.
        const useby = e.target.closest('[data-useby]');
        if (useby) {
          const owner = profiles.find((x) => x.id === useby.dataset.useby);
          if (owner) {
            selectedProfile = owner;
            setKind('profiles');
          }
          return;
        }

        const rm = e.target.closest('[data-rmprov]');
        if (rm && p) {
          // One BLOCK, by its config key. Removing one instance of a repeatable
          // provider leaves its siblings exactly as they are, under exactly the
          // keys they were stored under — nothing is renumbered, because a key
          // is what the stored config hangs on and moving one would silently
          // repoint it.
          delete p.providers[rm.dataset.rmprov];
          // Removing the block settles the question, so the note about it goes
          // too: adding the same provider again later is a fresh start, and
          // deserves the same grace the first attempt had.
          setRaised(p, rm.dataset.rmprov, false);
          render();
          touch('draft');
          return;
        }
        if (e.target.closest('[data-act="rmavatar"]') && p) return removeAvatar(p);

        if (e.target.id === 'goveeShow') {
          const f = $('goveeKey');
          f.type = f.type === 'password' ? 'text' : 'password';
          return;
        }
        if (e.target.id === 'goveeDiscover') {
          say('Discovering… (a few seconds per device)');
          const reply = await ask('goveeDiscover');
          if (!reply.ok) return say(reply.error ?? 'discovery failed', 'err');
          say(`${reply.devices.length} device(s), ${reply.scenes.length} Govee scene(s): ` +
              reply.devices.map((d) => d.name).join(', '), 'ok');
          // Govee scene dropdowns come from provider schemas, so refresh them.
          await loadProviders();
          return;
        }
        if (e.target.id === 'yamlDownload') {
          const r = await ask('exportYaml');
          download(`rig-profiles-${new Date().toISOString().slice(0, 10)}.yaml`, r.yaml ?? '', 'text/yaml');
          say('YAML downloaded.', 'ok');
        }
        if (e.target.id === 'backupDownload') {
          const r = await ask('exportBackup');
          if (!r?.ok) { say('Could not build the backup.', 'err'); return; }
          download(r.filename, JSON.stringify(r.bundle, null, 2), 'application/json');
          say('Backup downloaded. It contains no passwords or API keys.', 'ok');
        }
        if (e.target.id === 'pickFile') $('fileInput').click();
        if (e.target.id === 'restoreCancel') {
          pendingRestore = null;
          $('restorePreview').innerHTML = '';
        }
        if (e.target.id === 'restoreConfirm' && pendingRestore) {
          await doRestore({ source: 'upload', content: pendingRestore }, 'the file');
        }
        if (e.target.id === 'backupRestoreLast') {
          await doRestore({ source: 'mirror' }, 'the latest backup');
        }
        const histBtn = e.target.closest('[data-restore-id]');
        if (histBtn) {
          await doRestore({ source: 'generation', id: histBtn.dataset.restoreId }, 'that version');
        }
        if (e.target.id === 'yamlCopy') {
          navigator.clipboard?.writeText($('yamlOut').value)
            .then(() => say('Copied.', 'ok'), () => say('Select the text and copy it.', 'err'));
        }
      });

      $('rail').addEventListener('click', async (e) => {
        const p = current();

        // One handler for both kinds of offer, because adding a mode to a
        // profile and adding hardware to it are the same act from here: the
        // record gains something, a block for it appears in the middle column,
        // and the row that was clicked greys out.
        const add = e.target.closest('[data-add]');
        if (add && p) {
          const [type, id] = splitOnce(add.dataset.add);
          let addedKey = id;
          if (type === 'mode') {
            if (referencesMode(p, id)) return;      // never twice
            setModeRef(p, id, true);
          } else {
            p.providers = p.providers ?? {};
            // Twice is allowed only where the provider says so. Everything else
            // keeps the old rule, and its row is greyed out anyway — this is
            // the guard behind it, for a stale render or a keyboard activation
            // that beat one.
            if (p.providers[id] && !isRepeatable(provOf(id))) return;
            // The key the new block is stored under: the bare id for the first,
            // `#2`, `#3` after that. Minted here, at the one moment the block
            // comes into existence, and never touched again — it is what the
            // stored config is keyed by. See `nextInstanceKey`.
            addedKey = nextInstanceKey(p, id);
            // Empty, and deliberately not an error: it is not stored until it
            // holds something, and it is not painted red until the user is
            // plainly finished with it. See `raisedBlanks`.
            p.providers[addedKey] = {};
            setRaised(p, addedKey, false);
          }
          render();
          touch('draft');
          // Land the user on what they just added rather than leaving it to be
          // hunted for at the bottom of a long profile.
          const card = document.querySelector(
            `[data-hw="${CSS.escape(type === 'mode' ? `mode:${id}` : addedKey)}"]`);
          card?.scrollIntoView({ block: 'center', behavior: 'smooth' });
          card?.classList.add('flash');
          return;
        }

        const jump = e.target.closest('[data-jump]');
        if (jump) return gotoSettings(jump.dataset.jump);

        if (e.target.id === 'refreshHardware') {
          say('Asking the hardware…');
          await loadProviders();
          say('Hardware options refreshed.', 'ok');
        }
      });

      // A change still in the page is a change that would be lost. With
      // autosave this only fires while a save is in flight, held for a name, or
      // blocked by a validation error — all of which are worth stopping for.
      window.addEventListener('beforeunload', (e) => {
        if (!isDirty()) return;
        e.preventDefault();
        e.returnValue = '';
      });

      // Leaving the page in any other way is the natural moment to flush.
      window.addEventListener('blur', () => { if (isDirty() && !namingInProgress()) commit(); });

      /**
       * The event stream is how the plugin knows a page is still open — closing
       * this tab is what stops the server. It carries no data, so losing it just
       * means the editor is no longer live.
       */
      function connect() {
        const es = new EventSource(`/events${q}`);
        es.onopen = () => {
          $('dot').className = 'dot live';
          $('conn').textContent = 'connected';
        };
        es.onerror = () => {
          $('dot').className = 'dot gone';
          $('conn').textContent = 'disconnected — reopen from the Stream Deck';
        };
      }

      // The offer bar lives outside #pane, so it needs its own handler.
      $('offerBar').addEventListener('click', async (e) => {
        if (e.target.id === 'offerRestore') {
          // Restore the copy the banner described. It is not always the
          // mirror: the best available may be an older generation.
          await doRestore(
            offered?.source === 'generation'
              ? { source: 'generation', id: offered.id }
              : { source: 'mirror' },
            'the backup',
          );
        }
        if (e.target.id === 'offerDismiss') {
          // Dismissal lasts for this page only. Reopening the editor while the
          // store is still short of a backup asks again, which is right: the
          // problem has not gone away just because it was waved off once.
          dismissedOffer = true;
          $('offerBar').hidden = true;
        }
      });

      // Drag-and-drop, plus the file picker behind "Choose a file…".
      //
      // Bound on the document rather than the drop zone, because the zone is
      // re-rendered with the Settings pane and a listener on the element itself
      // would be lost every time that happened.
      document.addEventListener('dragover', (e) => {
        const zone = e.target.closest?.('#dropZone');
        if (!zone) return;
        e.preventDefault();
        zone.classList.add('over');
      });
      document.addEventListener('dragleave', (e) => {
        e.target.closest?.('#dropZone')?.classList.remove('over');
      });
      document.addEventListener('drop', async (e) => {
        const zone = e.target.closest?.('#dropZone');
        if (!zone) return;
        e.preventDefault();
        zone.classList.remove('over');
        const file = e.dataTransfer?.files?.[0];
        if (file) previewFile(await file.text());
      });
      document.addEventListener('change', async (e) => {
        if (e.target.id !== 'fileInput') return;
        const file = e.target.files?.[0];
        if (file) previewFile(await file.text());
        // Cleared so choosing the same file twice fires again.
        e.target.value = '';
      });

      (async () => {
        connect();
        await loadProfiles();
        // Through setKind so the selector, the search placeholder and the line
        // explaining what a profile is are all set from the one place that
        // knows, rather than being duplicated in the markup and drifting.
        setKind('profiles');
        await loadProviders();
        render();
        // Last, so a degraded store is the first thing seen but nothing waits on it.
        checkBackupOffer();
      })();
    </script>
  </body>
</html>
