<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; --amber: #e8a317; --red: #d64545; }
      body {
        font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
        color: #d8d8d8; background: #2d2d2d; margin: 0; padding: 12px;
      }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      label { flex: 0 0 92px; text-align: right; color: #969696; }
      select {
        flex: 1; min-width: 0; background: #3d3d3d; color: #d8d8d8;
        border: 1px solid #4d4d4d; border-radius: 4px; padding: 4px 6px;
      }
      select.unset { border-color: var(--amber); }
      .hint { margin-left: 100px; color: #7a7a7a; font-size: 11px; }
      .err  { margin-left: 100px; color: var(--red); font-size: 11px; }
      button {
        background: #4a4a4a; color: #d8d8d8; border: 1px solid #5a5a5a;
        border-radius: 4px; padding: 4px 10px; cursor: pointer;
      }
      button:hover { background: #565656; }
      .actions {
        display: flex; gap: 8px; margin-top: 12px;
        border-top: 1px solid #414141; padding-top: 10px;
      }
      code { font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
    </style>
  </head>
  <body>
    <div class="row">
      <label for="scene">Scene</label>
      <select id="scene"><option value="">Loading…</option></select>
    </div>
    <div class="hint" id="summary">This key runs the selected scene.</div>

    <div class="actions">
      <button id="edit">Edit scenes…</button>
    </div>
    <div class="hint" id="editState">
      Opens the full editor in your browser. It closes the moment you close the tab.
    </div>
    <div class="err" id="editError" hidden></div>

    <script>
      // Property inspector for the scene action. Deliberately the same shape as
      // the profile one: bind a key to a thing, and send editing to the browser.
      //
      // The scene list comes straight from global settings rather than a
      // sendToPlugin round-trip — the panel already receives them, so asking
      // the plugin for what it has just been handed adds a failure mode for
      // nothing.
      let ws, uuid, actionUuid;
      let globals = null;
      let settings = {};
      const pending = new Map();

      const send = (event, payload) =>
        ws?.readyState === 1 && ws.send(JSON.stringify({ event, context: uuid, payload }));

      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      /** Always settles: an unanswered request must not hang the panel forever. */
      function ask(request, extra = {}, timeoutMs = 8000) {
        return new Promise((resolve) => {
          const timer = setTimeout(() => {
            pending.delete(request);
            resolve({ request, ok: false, error: 'no reply from the plugin (timed out)' });
          }, timeoutMs);
          pending.set(request, (reply) => { clearTimeout(timer); resolve(reply); });
          ws.send(JSON.stringify({
            event: 'sendToPlugin', context: uuid, action: actionUuid,
            payload: { request, ...extra },
          }));
        });
      }

      function saveKeySettings(next) {
        settings = { ...settings, ...next };
        ws.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings }));
      }

      function renderKeyPicker() {
        const select = document.getElementById('scene');
        const summary = document.getElementById('summary');
        const scenes = globals?.scenes ?? [];
        const chosen = settings?.sceneId ?? '';

        if (!scenes.length) {
          select.innerHTML = '<option value="">No scenes yet</option>';
          summary.textContent = 'Add one with "Edit scenes…".';
          return;
        }

        // Without a placeholder the browser shows the first entry as though it
        // were selected, no change event fires, and the key stays unassigned
        // while looking set — the exact bug this panel had for profiles.
        const placeholder = chosen ? '' : '<option value="" selected>— Select a scene —</option>';
        select.innerHTML = placeholder + scenes
          .map((s) => `<option value="${s.id}"${s.id === chosen ? ' selected' : ''}>${esc(s.name)}</option>`)
          .join('');
        select.classList.toggle('unset', !chosen);

        if (!chosen) {
          summary.textContent = 'This key does nothing until you pick a scene.';
          return;
        }
        const active = scenes.find((s) => s.id === chosen);
        const names = Object.keys(active?.providers ?? {});
        summary.textContent = names.length
          ? `Runs: ${names.join(', ')}`
          : 'This scene does not do anything yet.';
      }

      document.getElementById('scene').addEventListener('change', (e) => {
        saveKeySettings({ sceneId: e.target.value });
        renderKeyPicker();
      });

      document.getElementById('edit').addEventListener('click', async () => {
        const state = document.getElementById('editState');
        const error = document.getElementById('editError');
        state.textContent = 'Starting the editor…';
        error.hidden = true;

        const reply = await ask('openEditor');
        if (!reply.ok) {
          state.textContent = '';
          error.hidden = false;
          error.textContent = reply.error ?? 'could not start the editor';
          return;
        }
        state.innerHTML = `Open in your browser: <code>${esc(reply.url)}</code>`;
      });

      function connectElgatoStreamDeckSocket(port, propertyInspectorUUID, registerEvent, info, actionInfoJson) {
        uuid = propertyInspectorUUID;
        const actionInfo = JSON.parse(actionInfoJson);
        actionUuid = actionInfo?.action;
        settings = actionInfo?.payload?.settings ?? {};
        ws = new WebSocket(`ws://127.0.0.1:${port}`);

        ws.onopen = () => {
          ws.send(JSON.stringify({ event: registerEvent, uuid }));
          send('getGlobalSettings');
          send('getSettings');
        };

        ws.onmessage = (evt) => {
          const msg = JSON.parse(evt.data);
          if (msg.event === 'didReceiveGlobalSettings') {
            globals = msg.payload.settings;
            renderKeyPicker();
          }
          if (msg.event === 'didReceiveSettings') {
            settings = msg.payload.settings ?? {};
            renderKeyPicker();
          }
          if (msg.event === 'sendToPropertyInspector') {
            const resolve = pending.get(msg.payload?.request);
            if (resolve) { pending.delete(msg.payload.request); resolve(msg.payload); }
          }
        };
      }
      window.connectElgatoStreamDeckSocket = connectElgatoStreamDeckSocket;
    </script>
  </body>
</html>
